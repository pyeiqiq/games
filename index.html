<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>妙豆游戏屋 · Miaodou Games</title>
<meta name="description" content="妙豆游戏屋：收录合成大西瓜、型月立方连连看、警长抓坏蛋等趣味小游戏，持续上新。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233c4bd8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 11h4M8 9v4'/%3E%3Cpath d='M15.5 10.5h.01M18 13h.01'/%3E%3Crect x='2' y='6' width='20' height='12' rx='3'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #f7f8fb;
    --bg-deep: #eef1f7;
    --card: #ffffff;
    --ink: #171d29;
    --ink-2: #5a6473;
    --ink-3: #9aa3b2;
    --line: #e7eaf1;
    --primary: #3346d9;
    --primary-deep: #2a3ab8;
    --primary-soft: #edf0fe;
    --accent: #f08c1e;
    --radius: 20px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 28px; }

  /* ---------- 顶栏 ---------- */
  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(247,248,251,.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .nav { display: flex; align-items: center; justify-content: space-between; height: 66px; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: var(--ink); }
  .brand-mark {
    width: 38px; height: 38px; border-radius: 12px;
    background: linear-gradient(135deg, #4a5be8, #2a3ab8);
    display: flex; align-items: center; justify-content: center; color: #fff;
    box-shadow: 0 6px 14px -6px rgba(51,70,217,.5);
  }
  .brand b { font-size: 17px; letter-spacing: .02em; display: block; line-height: 1.2; }
  .brand span { font-size: 11px; color: var(--ink-3); letter-spacing: .14em; text-transform: uppercase; }

  .auth-area { display: flex; align-items: center; gap: 10px; }
  .user-chip {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); padding: 7px 14px; border-radius: 999px;
  }
  .user-chip .u-dot { width: 8px; height: 8px; border-radius: 50%; background: #3cb371; }
  .user-chip.is-guest .u-dot { background: var(--accent); }
  .user-chip.is-guest { color: var(--ink-2); }
  .auth-area a.link {
    font-size: 13px; color: var(--ink-2); text-decoration: none; cursor: pointer;
    border: 1px solid var(--line); background: var(--card);
    padding: 7px 14px; border-radius: 999px; transition: all .18s ease;
  }
  .auth-area a.link:hover { color: var(--primary); border-color: var(--primary); transform: translateY(-1px); }
  .auth-area a.link.primary {
    background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600;
    box-shadow: 0 8px 18px -8px rgba(51,70,217,.55);
  }
  .auth-area a.link.primary:hover { background: var(--primary-deep); }

  /* ---------- 公告条 ---------- */
  .notice-bar {
    display: none; align-items: center; gap: 10px;
    background: #fdf6e9; border-bottom: 1px solid #f3e3c4;
    padding: 10px 0; font-size: 13px; color: #9a6a1a;
  }
  .notice-bar.show { display: flex; }
  .notice-bar svg { flex: none; }

  /* ---------- 首屏 ---------- */
  .hero { position: relative; padding: 88px 0 60px; text-align: center; }
  .hero::after {
    content: ""; position: absolute; border-radius: 50%; filter: blur(70px); pointer-events: none;
  }
  /* 暖色光晕保留在右下角，避开居中标题（蓝色光晕已移除，防止垫在妙豆透明图后面显蓝底） */
  .hero::after { width: 300px; height: 300px; background: rgba(240,140,30,.08); bottom: -140px; right: -120px; }

  .hero .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12.5px; font-weight: 500; letter-spacing: .06em;
    color: var(--primary); background: var(--primary-soft);
    border: 1px solid #dbe1fd; padding: 7px 16px; border-radius: 999px;
  }
  .hero .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .hero h1 {
    margin-top: 24px; font-size: 52px; font-weight: 800; letter-spacing: .01em; line-height: 1.15;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .hero h1 em { font-style: normal; background: linear-gradient(120deg, #4a5be8 20%, #7a63e8 60%, #f08c1e 110%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hero h1 .brand-mark { height: 1.5em; width: auto; display: block; background: none; box-shadow: none; border-radius: 0; }
  .hero p { margin: 18px auto 0; max-width: 520px; color: var(--ink-2); font-size: 15.5px; line-height: 1.85; }

  .hero .stats { margin-top: 34px; display: inline-flex; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 6px 8px; box-shadow: 0 1px 2px rgba(23,29,41,.04), 0 12px 32px -16px rgba(23,29,41,.12); }
  .hero .stat { padding: 10px 26px; position: relative; }
  .hero .stat + .stat::before { content: ""; position: absolute; left: 0; top: 22%; height: 56%; width: 1px; background: var(--line); }
  .hero .stat b { display: block; font-size: 22px; font-weight: 700; color: var(--ink); }
  .hero .stat b i { font-style: normal; color: var(--accent); }
  .hero .stat span { display: block; margin-top: 2px; font-size: 12px; color: var(--ink-3); letter-spacing: .04em; }

  /* 首屏漂浮装饰 */
  .float { position: absolute; pointer-events: none; opacity: .9; }
  .float svg { display: block; }
  .f1 { top: 96px; left: 12%; animation: floaty 6s ease-in-out infinite; }
  .f2 { top: 210px; right: 14%; animation: floaty 7s ease-in-out infinite 1.2s; }
  .f3 { bottom: 88px; left: 20%; animation: floaty 8s ease-in-out infinite .6s; }
  .f4 { bottom: 120px; right: 21%; animation: floaty 6.5s ease-in-out infinite 2s; }
  @keyframes floaty { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-14px) rotate(3deg); } }
  @media (max-width: 900px) { .float { display: none; } }

  /* ---------- 游戏区标题 ---------- */
  .section-head { display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 26px; }
  .section-head h2 { font-size: 26px; font-weight: 700; letter-spacing: .01em; }
  .section-head h2 small { display: block; margin-top: 6px; font-size: 13px; font-weight: 400; color: var(--ink-3); letter-spacing: .05em; }
  .section-head .count { font-size: 13px; color: var(--ink-2); background: var(--card); border: 1px solid var(--line); padding: 7px 14px; border-radius: 999px; }

  /* ---------- 游戏卡片 ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 26px; padding-bottom: 84px; }
  .game {
    position: relative; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 1px 2px rgba(23,29,41,.04), 0 10px 28px -18px rgba(23,29,41,.14);
    overflow: hidden; display: flex; flex-direction: column;
    transition: transform .26s cubic-bezier(.22,.68,.32,1), box-shadow .26s ease;
    text-decoration: none; color: var(--ink);
  }
  .game:hover {
    transform: translateY(-6px);
    box-shadow: 0 2px 6px rgba(23,29,41,.05), 0 28px 52px -22px rgba(23,29,41,.28);
  }
  .cover {
    position: relative; height: 200px; overflow: hidden;
    background: linear-gradient(140deg, var(--c1), var(--c2));
    display: flex; align-items: center; justify-content: center;
  }
  .cover .scene { transition: transform .45s cubic-bezier(.22,.68,.32,1); }
  .game:hover .cover .scene { transform: scale(1.07) translateY(-2px); }
  .cover::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 50% -10%, rgba(255,255,255,.28), transparent 55%);
    pointer-events: none;
  }
  .cover .corner {
    position: absolute; top: 14px; right: 14px; z-index: 2;
    font-size: 11px; font-weight: 600; letter-spacing: .08em;
    color: #fff; background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.35); backdrop-filter: blur(4px);
    padding: 4px 12px; border-radius: 999px;
  }
  .body { padding: 20px 22px 22px; display: flex; flex-direction: column; flex: 1; }
  .tag-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .tag {
    font-size: 11px; padding: 4px 11px; border-radius: 999px;
    background: var(--primary-soft); color: var(--primary); font-weight: 500;
  }
  .tag.alt { background: #fdf2e2; color: #c96f0a; }
  .game h3 { font-size: 20px; font-weight: 700; letter-spacing: .01em; }
  .game .desc { margin-top: 9px; font-size: 13.5px; color: var(--ink-2); line-height: 1.75; flex: 1; }
  .game .foot { margin-top: 20px; display: flex; align-items: center; justify-content: space-between; }
  .game .btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--primary); color: #fff;
    padding: 11px 22px; border-radius: 12px; font-size: 14px; font-weight: 600;
    transition: background .18s ease, transform .18s ease, box-shadow .18s ease;
    box-shadow: 0 8px 18px -8px rgba(51,70,217,.55);
  }
  .game:hover .btn { background: var(--primary-deep); transform: translateY(-1px); box-shadow: 0 10px 22px -8px rgba(51,70,217,.65); }
  .game .btn svg { transition: transform .18s ease; }
  .game:hover .btn svg { transform: translateX(3px); }
  .game .arrow-link { font-size: 12.5px; color: var(--ink-3); transition: color .18s; }
  .game:hover .arrow-link { color: var(--primary); }

  /* ---------- 预留卡片 ---------- */
  .game.soon {
    border: 1.5px dashed #d4d9e4; box-shadow: none; background: transparent;
    align-items: center; justify-content: center; min-height: 320px; text-align: center;
  }
  .game.soon:hover { transform: none; box-shadow: none; }
  .game.soon .plus {
    width: 58px; height: 58px; border-radius: 50%; border: 1.5px dashed #c9d0dd;
    display: flex; align-items: center; justify-content: center; color: var(--ink-3); margin-bottom: 16px;
    background: var(--card);
  }
  .game.soon b { font-size: 15px; font-weight: 600; color: var(--ink-2); }
  .game.soon p { margin-top: 7px; font-size: 12.5px; color: var(--ink-3); }

  /* ---------- 登录弹窗 ---------- */
  .mask {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(23,29,41,.45); backdrop-filter: blur(4px);
    align-items: center; justify-content: center; padding: 20px;
  }
  .mask.show { display: flex; }
  .modal {
    width: 400px; max-width: 100%; background: var(--card);
    border-radius: 22px; box-shadow: 0 30px 80px -20px rgba(23,29,41,.4);
    padding: 28px; animation: pop .28s cubic-bezier(.22,.68,.32,1);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(16px) scale(.97); } }
  .modal h3 { font-size: 20px; font-weight: 700; }
  .modal .m-sub { margin-top: 6px; font-size: 13px; color: var(--ink-2); line-height: 1.6; }
  .tabs { display: flex; gap: 6px; margin: 20px 0 18px; background: var(--bg-deep); border-radius: 12px; padding: 5px; }
  .tabs button {
    flex: 1; border: none; background: transparent; cursor: pointer;
    font-size: 14px; font-weight: 600; color: var(--ink-2);
    padding: 9px 0; border-radius: 9px; transition: all .18s;
    font-family: inherit;
  }
  .tabs button.on { background: var(--card); color: var(--primary); box-shadow: 0 2px 8px rgba(23,29,41,.1); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; font-weight: 500; }
  .field input {
    width: 100%; font-size: 14.5px; font-family: inherit;
    border: 1.5px solid var(--line); border-radius: 12px;
    padding: 11px 14px; outline: none; transition: border .18s, box-shadow .18s;
    background: var(--bg);
  }
  .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(51,70,217,.12); background: #fff; }
  .m-btn {
    width: 100%; border: none; cursor: pointer; font-family: inherit;
    background: var(--primary); color: #fff; font-size: 15px; font-weight: 600;
    padding: 12px 0; border-radius: 12px; margin-top: 4px;
    box-shadow: 0 10px 20px -8px rgba(51,70,217,.55);
    transition: background .18s, transform .18s;
  }
  .m-btn:hover { background: var(--primary-deep); transform: translateY(-1px); }
  .m-btn:disabled { opacity: .6; cursor: default; transform: none; }
  .m-close {
    float: right; width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--bg-deep); color: var(--ink-2); font-size: 15px; line-height: 1;
    display: flex; align-items: center; justify-content: center; transition: all .18s;
  }
  .m-close:hover { background: #e3e7ef; color: var(--ink); }
  .m-msg { display: none; margin-top: 12px; font-size: 13px; padding: 10px 12px; border-radius: 10px; line-height: 1.5; }
  .m-msg.err { display: block; background: #fdeceb; color: #c0392b; }
  .m-msg.ok { display: block; background: #e9f7ef; color: #1e8e4e; }
  .guest-tip { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); font-size: 12.5px; color: var(--ink-3); line-height: 1.7; }

  /* ---------- 轻提示 ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);
    background: #232a3a; color: #fff; font-size: 13.5px;
    padding: 11px 20px; border-radius: 12px; z-index: 200;
    opacity: 0; pointer-events: none; transition: all .3s cubic-bezier(.22,.68,.32,1);
    box-shadow: 0 14px 34px -10px rgba(23,29,41,.5); max-width: 86vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- 页脚 ---------- */
  footer { border-top: 1px solid var(--line); padding: 30px 0 38px; text-align: center; background: var(--bg-deep); }
  footer p { font-size: 12.5px; color: var(--ink-2); line-height: 2; }
  footer a { color: var(--ink-3); text-decoration: none; transition: color .18s; }
  footer a:hover { color: var(--primary); }

  @media (max-width: 560px) {
    .hero { padding: 60px 0 44px; }
    .hero h1 { font-size: 34px; }
    .hero .stat { padding: 8px 16px; }
    .hero .stat b { font-size: 18px; }
    .grid { grid-template-columns: 1fr; }
    .section-head { flex-direction: column; align-items: flex-start; gap: 10px; }
    .brand span.en { display: none; }
  }

  /* 入场动效 */
  .reveal { opacity: 0; transform: translateY(18px); animation: reveal .7s cubic-bezier(.22,.68,.32,1) forwards; }
  @keyframes reveal { to { opacity: 1; transform: none; } }
</style>
</head>

<script>
/* =========================================================
 * 游戏清单：以后出新游戏，只需在这里加一个对象 + 一段封面插画。

/* =========================================================
 * 后端连接（CloudBase PostgreSQL / PostgREST）
 * ========================================================= */
const CFG = window.MD_CONFIG || {};
const API_ON = !!(CFG.envId && CFG.apiKey);
const API = {
  base: `https://${CFG.envId}.api.tcloudbasegateway.com/v1/rdb/rest`,
  h() {
    return { "apikey": CFG.apiKey, "Authorization": "Bearer " + CFG.apiKey, "Content-Type": "application/json", "Accept": "application/json" };
  },
  async get(t, q) {
    const r = await fetch(`${this.base}/${t}${q ? "?" + q : ""}`, { headers: this.h() });
    if (!r.ok) throw new Error("读取失败 " + r.status + " " + (await r.text()).slice(0, 120));
    return r.json();
  },
  async post(t, body) {
    const r = await fetch(`${this.base}/${t}`, { method: "POST", headers: this.h(), body: JSON.stringify(body) });
    if (!r.ok && r.status !== 201) throw new Error("写入失败 " + r.status + " " + (await r.text()).slice(0, 120));
    return true;
  }
};

const SALT = "miaodou-games-v1";
const sha256 = s => window.sha256Hex(s);   // 非安全上下文自动回退纯 JS 实现
const hashPass = (u, p) => sha256(u + ":" + p + ":" + SALT);

/* ---------- 会话 ---------- */
let session = null;
try { session = JSON.parse(localStorage.getItem("md_session") || "null"); } catch (e) { session = null; }
function saveSession(s) { session = s; localStorage.setItem("md_session", JSON.stringify(s)); renderAuth(); }
function clearSession() { session = null; localStorage.removeItem("md_session"); renderAuth(); }

/* ---------- 轻提示 ---------- */
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- 顶栏账号区 ---------- */
function renderAuth() {
  const area = document.getElementById("authArea");
  if (!API_ON) { area.innerHTML = ""; return; }
  if (session) {
    area.innerHTML = `
      <span class="user-chip ${session.is_guest ? "is-guest" : ""}"><span class="u-dot"></span>${esc(session.username)}</span>
      ${session.is_guest ? '<a class="link primary" id="btnAuth">注册 / 登录</a>' : ""}
      <a class="link" id="btnLogout">退出</a>`;
    const bA = document.getElementById("btnAuth");
    if (bA) bA.onclick = openAuth;
    document.getElementById("btnLogout").onclick = async () => {
      clearSession();
      toast("已退出，重新生成了游客身份");
      await createGuest();
    };
  } else {
    area.innerHTML = '<a class="link primary" id="btnAuth">登录 / 注册</a>';
    document.getElementById("btnAuth").onclick = openAuth;
  }
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- 游客身份 ---------- */
async function createGuest() {
  if (!API_ON) return;
  const n = "游客" + String(Math.floor(1000 + Math.random() * 9000));
  try {
    const exists = await API.get("users", "username=eq." + encodeURIComponent(n) + "&select=username");
    if (exists.length) return createGuest();
    await API.post("users", { username: n, pass_hash: null, role: "user", is_guest: true });
    saveSession({ username: n, role: "user", is_guest: true });
    await API.post("login_logs", { username: n, is_guest: true });
  } catch (e) { /* 后端异常时静默降级为无账号模式 */ }
}

/* ---------- 登录 / 注册弹窗 ---------- */
const mask = document.getElementById("authMask");
let authMode = "login";
function openAuth() { mask.classList.add("show"); setMode("login"); }
function closeAuth() { mask.classList.remove("show"); }
function setMode(m) {
  authMode = m;
  document.getElementById("tabLogin").classList.toggle("on", m === "login");
  document.getElementById("tabReg").classList.toggle("on", m === "reg");
  document.getElementById("fPass2Wrap").style.display = m === "reg" ? "" : "none";
  document.getElementById("authSubmit").textContent = m === "login" ? "登 录" : "注 册";
  document.getElementById("authMsg").className = "m-msg";
}
document.getElementById("tabLogin").onclick = () => setMode("login");
document.getElementById("tabReg").onclick = () => setMode("reg");
document.getElementById("authClose").onclick = closeAuth;
mask.addEventListener("click", e => { if (e.target === mask) closeAuth(); });

document.getElementById("authSubmit").onclick = async () => {
  const btn = document.getElementById("authSubmit");
  const msg = document.getElementById("authMsg");
  const u = document.getElementById("fUser").value.trim();
  const p = document.getElementById("fPass").value;
  const p2 = document.getElementById("fPass2").value;
  const show = (t, cls) => { msg.textContent = t; msg.className = "m-msg " + cls; };

  if (!API_ON) { show("后端未配置：请在 config.js 中填入 anon key", "err"); return; }
  if (!/^[\w\u4e00-\u9fa5]{2,16}$/.test(u)) { show("用户名需 2-16 位，仅中英文、数字、下划线", "err"); return; }
  if (p.length < 6 || p.length > 32) { show("密码需 6-32 位", "err"); return; }
  if (authMode === "reg" && p !== p2) { show("两次输入的密码不一致", "err"); return; }

  btn.disabled = true;
  try {
    const h = await hashPass(u, p);
    if (authMode === "reg") {
      const dup = await API.get("users", "username=eq." + encodeURIComponent(u) + "&select=username");
      if (dup.length) { show("该用户名已被注册", "err"); return; }
      await API.post("users", { username: u, pass_hash: h, role: "user", is_guest: false });
      await API.post("login_logs", { username: u, is_guest: false });
      saveSession({ username: u, role: "user", is_guest: false });
      show("注册成功，欢迎加入！", "ok");
    } else {
      const rows = await API.get("users", "username=eq." + encodeURIComponent(u) + "&pass_hash=eq." + h + "&select=username,role,is_guest");
      if (!rows.length) { show("用户名或密码不正确", "err"); return; }
      await API.post("login_logs", { username: u, is_guest: false });
      saveSession({ username: u, role: rows[0].role, is_guest: false });
      show("登录成功，欢迎回来！", "ok");
    }
    setTimeout(closeAuth, 700);
    document.getElementById("fPass").value = "";
    document.getElementById("fPass2").value = "";
  } catch (e) {
    show("操作失败：" + e.message, "err");
  } finally {
    btn.disabled = false;
  }
};

/* =========================================================
 * 页面渲染
 * ========================================================= */
const grid = document.getElementById("games");

function renderGames(shown) {
  grid.innerHTML = "";
  document.getElementById("gameCount").textContent = "共 " + shown.length + " 款";
  document.getElementById("statGames").innerHTML = shown.length + '<i>+</i>';
  shown.forEach((g, i) => {
    const card = document.createElement("a");
    card.className = "game reveal";
    card.href = g.url;
    card.style.animationDelay = (0.5 + i * 0.1) + "s";
    const tags = g.tags.map((t, j) => `<span class="tag${j === 1 ? " alt" : ""}">${t}</span>`).join("");
    card.innerHTML = `
      <div class="cover" style="--c1:${g.colors[0]};--c2:${g.colors[1]}">
        <span class="corner">${g.badge}</span>
        ${SCENES[g.icon]}
      </div>
      <div class="body">
        <div class="tag-row">${tags}</div>
        <h3>${g.title}</h3>
        <p class="desc">${g.desc}</p>
        <div class="foot">
          <span class="btn">开始游戏
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </span>
          <span class="arrow-link">免安装 · 即点即玩</span>
        </div>
      </div>`;
    card.addEventListener("click", e => {
      if (API_ON && session) {
        try {
          fetch(`${API.base}/play_logs`, {
            method: "POST", headers: API.h(), keepalive: true,
            body: JSON.stringify({ username: session.username, game_key: g.key })
          }).catch(() => {});
        } catch (err) {}
      }
    });
    grid.appendChild(card);
  });

  const soon = document.createElement("div");
  soon.className = "game soon reveal";
  soon.style.animationDelay = (0.5 + shown.length * 0.1) + "s";
  soon.innerHTML = `
    <div>
      <div class="plus">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <b>更多游戏开发中</b>
      <p>新作品将在这里陆续上架，敬请期待</p>
    </div>`;
  grid.appendChild(soon);
}

/* ---------- 启动 ---------- */
(async function init() {
  renderAuth();

  // 预览模式：全部显示
  if (!API_ON) { renderGames(GAMES); return; }

  // 无会话 → 自动生成游客身份
  if (!session) await createGuest();

  // 读取游戏开关与公告
  let shown = GAMES;
  try {
    const rows = await API.get("game_settings", "select=game_key,visible&order=sort.asc");
    const map = {}; rows.forEach(r => map[r.game_key] = r.visible);
    shown = GAMES.filter(g => map[g.key] !== false);
  } catch (e) {}
  try {
    const n = await API.get("site_settings", "key=eq.notice&select=value");
    if (n.length && n[0].value && n[0].value.trim()) {
      document.getElementById("noticeText").textContent = n[0].value.trim();
      document.getElementById("noticeBar").classList.add("show");
    }
  } catch (e) {}

  renderGames(shown);
})();
</script>
