<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>密聊房间 · 妙豆游戏屋</title>
<style>
  :root{
    --bg:#0f1220;
    --panel:#171b2e;
    --bubble:#222845;
    --mine:#2f6df6;
    --text:#e8ecf6;
    --muted:#8a93ad;
    --accent:#5b8cff;
    --gold:#f0b429;
    --ok:#3ecf8e;
    --err:#ff6b6b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 70% -10%,#1c2545 0%,var(--bg) 55%);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    padding:16px;
  }
  .app{
    width:100%;max-width:760px;height:min(92vh,820px);
    background:var(--panel);
    border:1px solid rgba(255,255,255,.06);
    border-radius:20px;
    box-shadow:0 30px 80px rgba(0,0,0,.45);
    display:flex;flex-direction:column;overflow:hidden;
  }
  header{
    padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.06);
    display:flex;align-items:center;gap:12px;
  }
  .lock{
    width:38px;height:38px;border-radius:12px;flex:none;
    background:linear-gradient(135deg,#2f6df6,#7b5bff);
    display:flex;align-items:center;justify-content:center;font-size:18px;
  }
  .title{font-weight:600;font-size:16px;line-height:1.2;}
  .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .head-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);}
  .back-btn{
    border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:var(--text);
    border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;text-decoration:none;
  }
  .back-btn:hover{background:rgba(255,255,255,.1);}

  .status{padding:6px 18px;font-size:12px;color:var(--muted);text-align:center;}

  /* ===== 大厅（创建/加入房间） ===== */
  .lobby{flex:1;overflow-y:auto;padding:26px 22px;display:flex;flex-direction:column;gap:16px;}
  .lobby-hero{text-align:center;padding:18px 10px 6px;}
  .lobby-hero .big{font-size:34px;}
  .lobby-hero h1{font-size:22px;margin:10px 0 6px;font-weight:700;}
  .lobby-hero p{font-size:13px;color:var(--muted);line-height:1.7;max-width:480px;margin:0 auto;}
  .lobby-actions{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:600px;margin:0 auto;width:100%;}
  @media (max-width:560px){.lobby-actions{grid-template-columns:1fr;}}
  .l-card{
    padding:22px;border-radius:16px;background:var(--bubble);
    border:1px solid rgba(255,255,255,.08);text-align:center;
  }
  .l-card .ico{font-size:30px;}
  .l-card h3{font-size:15px;margin:12px 0 6px;}
  .l-card p{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:14px;}
  .btn{
    display:inline-block;border:none;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:600;
    color:#fff;background:linear-gradient(135deg,#2f6df6,#7b5bff);cursor:pointer;text-decoration:none;
  }
  .btn:active{transform:scale(.97);}
  .btn.gold{background:linear-gradient(135deg,#f0a43a,#f0b429);}
  .btn.gray{background:rgba(255,255,255,.1);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.danger{background:linear-gradient(135deg,#e05555,#ff6b6b);}
  .room-input{
    width:100%;background:var(--panel);border:1px solid rgba(255,255,255,.12);
    color:var(--text);border-radius:10px;padding:11px 14px;font-size:15px;text-align:center;
    outline:none;letter-spacing:4px;font-weight:700;text-transform:uppercase;
  }
  .room-input:focus{border-color:var(--accent);}
  .msg-line{font-size:13px;text-align:center;min-height:20px;margin-top:8px;}
  .msg-line.ok{color:var(--ok);}
  .msg-line.err{color:var(--err);}
  .guest-note{
    max-width:560px;margin:6px auto 0;padding:12px 16px;border-radius:12px;
    background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.3);
    font-size:12px;color:#d9c190;line-height:1.7;text-align:center;
  }
  .guest-note a{color:var(--gold);}

  /* ===== 聊天室 ===== */
  .chatroom{flex:1;display:none;flex-direction:column;min-height:0;}
  .room-head{
    padding:10px 18px;border-bottom:1px solid rgba(255,255,255,.06);
    display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap;
  }
  .room-badge{
    background:rgba(91,140,255,.16);color:#cfe0ff;border:1px solid rgba(91,140,255,.35);
    border-radius:8px;padding:3px 10px;font-weight:700;letter-spacing:1px;
  }
  .room-title-el{font-weight:600;font-size:14px;color:#fff;}
  .room-info{color:var(--muted);font-size:11px;}
  .room-head .sp{flex:1;}
  .mini-btn{
    border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--text);
    border-radius:8px;padding:4px 9px;font-size:11px;cursor:pointer;
  }
  .mini-btn:hover{background:rgba(255,255,255,.1);}
  .mini-btn.blue{border-color:rgba(91,140,255,.5);background:rgba(91,140,255,.12);color:#cfe0ff;}
  .mini-btn.red{border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.1);color:#ffb3b3;}
  .body-chat{flex:1;display:flex;min-height:0;}
  #messages{
    flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;
    scrollbar-width:thin;
  }
  #messages::-webkit-scrollbar{width:6px;}
  #messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px;}
  .members-side{
    width:130px;flex:none;border-left:1px solid rgba(255,255,255,.06);
    padding:12px 10px;overflow-y:auto;background:rgba(255,255,255,.02);
  }
  .members-title{font-size:12px;color:var(--muted);margin-bottom:10px;font-weight:600;}
  #memlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  #memlist li{
    font-size:13px;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.04);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;
  }
  #memlist li:hover{background:rgba(255,255,255,.09);}
  #memlist li.me-item{background:rgba(91,140,255,.18);color:#cfe0ff;}
  #memlist li.owner-item{color:var(--gold);}
  .hint-tip{font-size:10px;color:var(--muted);margin-top:10px;line-height:1.6;}
  .row{display:flex;flex-direction:column;max-width:80%;}
  .row.mine{align-self:flex-end;align-items:flex-end;}
  .name{font-size:11px;color:var(--muted);margin:0 6px 4px;cursor:pointer;}
  .name:hover{color:var(--accent);}
  .bubble{
    position:relative;padding:10px 13px;border-radius:14px;line-height:1.45;
    font-size:15px;word-break:break-word;white-space:pre-wrap;
    background:var(--bubble);animation:pop .25s ease;
  }
  .row.mine .bubble{background:var(--mine);color:#fff;}
  .row.mine .name{text-align:right;}
  .sys{
    align-self:center;font-size:12px;color:var(--muted);
    background:rgba(255,255,255,.05);padding:4px 12px;border-radius:999px;
    animation:pop .25s ease;max-width:90%;text-align:center;
  }
  .bar{
    position:absolute;left:0;bottom:0;height:3px;width:100%;
    background:rgba(255,255,255,.35);border-radius:0 0 14px 14px;
    transform-origin:left;animation:shrink 20s linear forwards;
  }
  .row.perm .bar{display:none;}
  .bubble .perm-tag{font-size:10px;color:rgba(255,255,255,.45);margin-top:4px;}
  @keyframes shrink{from{transform:scaleX(1);}to{transform:scaleX(0);}}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98);}to{opacity:1;transform:none;}}
  .fade{opacity:0;transition:opacity .5s ease;}

  footer{padding:12px;border-top:1px solid rgba(255,255,255,.06);}
  .inputbar{display:flex;gap:8px;}
  #ttl{
    width:auto;flex:none;background:var(--bubble);border:1px solid rgba(255,255,255,.08);
    color:#fff;border-radius:12px;padding:0 6px;font-size:13px;outline:none;cursor:pointer;
  }
  #input{
    flex:1;background:var(--bubble);border:1px solid rgba(255,255,255,.08);
    color:var(--text);border-radius:12px;padding:11px 14px;font-size:15px;outline:none;
  }
  #input:focus{border-color:var(--accent);}
  #send{
    border:none;border-radius:12px;padding:0 18px;font-size:15px;font-weight:600;
    color:#fff;background:linear-gradient(135deg,#2f6df6,#7b5bff);cursor:pointer;
  }
  #send:active{transform:scale(.97);}
  .toast{
    position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);
    background:rgba(20,25,45,.95);color:#fff;padding:10px 18px;border-radius:10px;
    font-size:13px;opacity:0;transition:all .3s ease;pointer-events:none;z-index:99;
    border:1px solid rgba(255,255,255,.12);max-width:80vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  /* 改名弹窗 */
  .mask{
    position:fixed;inset:0;background:rgba(5,8,18,.7);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .mask.show{display:flex;}
  .modal{
    width:100%;max-width:340px;background:var(--panel);border:1px solid rgba(255,255,255,.1);
    border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .modal h3{font-size:15px;margin:0 0 14px;}
  .modal input{
    width:100%;background:var(--bubble);border:1px solid rgba(255,255,255,.12);
    color:var(--text);border-radius:10px;padding:11px 14px;font-size:14px;outline:none;
  }
  .modal input:focus{border-color:var(--accent);}
  .modal .m-actions{display:flex;gap:10px;margin-top:16px;}
  .modal .m-actions .btn{flex:1;text-align:center;}

  /* 房间销毁倒计时遮罩 */
  .destroy-mask{
    position:fixed;inset:0;background:rgba(5,8,18,.88);backdrop-filter:blur(6px);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    z-index:200;padding:20px;
  }
  .destroy-mask.show{display:flex;}
  .destroy-mask .d-title{font-size:17px;color:var(--text);font-weight:600;margin-bottom:6px;}
  .destroy-mask .d-sub{font-size:13px;color:var(--muted);margin-bottom:26px;}
  .destroy-mask .d-num{
    font-size:110px;font-weight:800;line-height:1;
    background:linear-gradient(135deg,#ff8a5c,#ff4d4d);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:pulse 1s ease infinite;
  }
  .destroy-mask .d-tip{font-size:12px;color:var(--muted);margin-top:26px;}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.08);opacity:.85;}}
  @media (max-width:560px){.members-side{width:96px;}}
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="lock">🔒</div>
      <div>
        <div class="title">密聊房间</div>
        <div class="sub" id="headSub">房间制私密聊天 · 阅后即焚</div>
      </div>
      <div class="head-right">
        <span id="whoami">…</span>
        <a class="back-btn" href="../">← 返回游戏屋</a>
      </div>
    </header>

    <div class="status" id="status">正在连接…</div>

    <!-- 大厅 -->
    <div class="lobby" id="lobby">
      <div class="lobby-hero">
        <div class="big">💬</div>
        <h1>开个房间，说点悄悄话</h1>
        <p>登录用户可创建专属房间，把房间号发给朋友，对方输入房间号即可加入。进房自动分配随机昵称，消息可设销毁时长，读完即焚、不留痕迹。</p>
      </div>
      <div class="lobby-actions">
        <div class="l-card">
          <div class="ico">🛠️</div>
          <h3>创建房间</h3>
          <p>生成一个专属房间号，发给朋友一起聊。</p>
          <button class="btn gold" id="createBtn" style="width:100%">创 建 房 间</button>
          <div class="msg-line" id="createMsg"></div>
        </div>
        <div class="l-card">
          <div class="ico">🚪</div>
          <h3>加入房间</h3>
          <p>朋友给了房间号？输进来即可进入。</p>
          <input class="room-input" id="joinInput" maxlength="8" placeholder="输入房间号" autocomplete="off" style="margin-bottom:10px">
          <button class="btn" id="joinBtn" style="width:100%">加 入 房 间</button>
          <div class="msg-line" id="joinMsg"></div>
        </div>
      </div>
      <div class="guest-note" id="guestNote"></div>
    </div>

    <!-- 聊天室 -->
    <div class="chatroom" id="chatroom">
      <div class="room-head">
        <span class="room-badge" id="roomBadge">——</span>
        <span class="room-title-el" id="roomTitle">…</span>
        <button class="mini-btn" id="renameBtn" type="button" title="修改房间名">✏️</button>
        <span class="sp"></span>
        <button class="mini-btn blue" id="shareBtn" type="button">复制房间号</button>
        <button class="mini-btn" id="clearBtn" type="button">清屏</button>
        <button class="mini-btn red" id="leaveBtn" type="button">退出</button>
      </div>
      <div class="body-chat">
        <div id="messages"></div>
        <aside class="members-side">
          <div class="members-title">在线成员 <span id="memcount">0</span></div>
          <ul id="memlist"></ul>
          <div class="hint-tip">双击成员名字可 @ 对方</div>
        </aside>
      </div>
      <footer>
        <div class="inputbar">
          <select id="ttl" title="消息销毁时间">
            <option value="3000">3 秒</option>
            <option value="10000">10 秒</option>
            <option value="20000" selected>20 秒</option>
            <option value="60000">60 秒</option>
            <option value="300000">5 分钟</option>
            <option value="0">永久</option>
          </select>
          <input id="input" type="text" maxlength="500" placeholder="说点什么…（回车发送）" autocomplete="off">
          <button id="send">发送</button>
        </div>
      </footer>
    </div>
  </div>

  <!-- 房间名弹窗 -->
  <div class="mask" id="mask">
    <div class="modal">
      <h3>设置房间名</h3>
      <input id="roomNameInput" maxlength="20" placeholder="给房间起个名字">
      <div class="m-actions">
        <button class="btn gray" id="nameCancel">取消</button>
        <button class="btn" id="nameOk">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 房间销毁倒计时 -->
  <div class="destroy-mask" id="destroyMask">
    <div class="d-title">🏠 房主已退出</div>
    <div class="d-sub">房间将在倒计时结束后销毁</div>
    <div class="d-num" id="destroyNum">5</div>
    <div class="d-tip">倒计时结束将自动返回游戏屋</div>
  </div>

<script src="../config.js"></script>
<script>
(function(){
  /* ================= 基础 ================= */
  const CFG = window.MD_CONFIG || {};
  const API_ON = !!(CFG.envId && CFG.apiKey);
  const API = {
    base: `https://${CFG.envId}.api.tcloudbasegateway.com/v1/rdb/rest`,
    h() { return { "apikey": CFG.apiKey, "Authorization": "Bearer " + CFG.apiKey, "Content-Type": "application/json", "Accept": "application/json" }; },
    async get(t, q) {
      const r = await fetch(`${this.base}/${t}${q ? "?" + q : ""}`, { headers: this.h() });
      if (!r.ok) throw new Error("读取失败 " + r.status + " " + (await r.text()).slice(0, 120));
      return r.json();
    },
    async post(t, body) {
      const r = await fetch(`${this.base}/${t}`, { method: "POST", headers: this.h(), body: JSON.stringify(body) });
      if (!r.ok && r.status !== 201) throw new Error("写入失败 " + r.status + " " + (await r.text()).slice(0, 120));
      return true;
    },
    async patch(t, q, body) {
      const r = await fetch(`${this.base}/${t}?${q}`, { method: "PATCH", headers: this.h(), body: JSON.stringify(body) });
      if (!r.ok && r.status !== 204) throw new Error("更新失败 " + r.status + " " + (await r.text()).slice(0, 120));
      return true;
    },
    async del(t, q) {
      const r = await fetch(`${this.base}/${t}?${q}`, { method: "DELETE", headers: this.h() });
      if (!r.ok && r.status !== 204) throw new Error("删除失败 " + r.status + " " + (await r.text()).slice(0, 120));
      return true;
    }
  };

  /* 会话：仅用于判断登录身份（开房资格），聊天昵称用随机昵称 */
  let session = null;
  try { session = JSON.parse(localStorage.getItem("md_session") || "null"); } catch(e) { session = null; }
  const accountName = session ? session.username : "";
  const isGuest = session ? !!session.is_guest : true;
  const isLoggedIn = !!(session && !session.is_guest);

  /* ================= 随机昵称 ================= */
  const COLORS = ["红", "橙", "黄", "绿", "青", "蓝", "紫", "粉", "金", "银"];
  const ANIMALS = ["狐狸", "熊猫", "老虎", "兔子", "猫头鹰", "海豚", "刺猬", "考拉", "麋鹿", "水獭", "企鹅", "松鼠"];
  function randomNick() {
    return COLORS[Math.floor(Math.random() * COLORS.length)] + ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
  }
  let myNick = randomNick();   // 每次进房随机分配

  const $ = id => document.getElementById(id);
  const status = $("status"), lobby = $("lobby"), chatroom = $("chatroom");
  const messages = $("messages"), input = $("input"), sendBtn = $("send"), ttlSel = $("ttl");
  const memlist = $("memlist"), memcount = $("memcount");
  const toastEl = $("toast");
  let toastTimer = null;
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2400); }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

  /* ================= 房间逻辑 ================= */
  let roomId = null;
  let roomOwner = "";
  let roomTitle = "";
  let pollTimer = null;
  let heartbeatTimer = null;
  let lastMsgId = 0;
  let renderedClientIds = new Set();  // 已渲染消息的 client_id，去重用

  function genRoomId() {
    const chars = "23456789";
    let s = "";
    for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }
  function setStatus(t, color) { status.textContent = t; status.style.color = color || ""; }
  function showChat() { lobby.style.display = "none"; chatroom.style.display = "flex"; }
  function goLobby(msg) {
    clearInterval(pollTimer); pollTimer = null;
    clearInterval(heartbeatTimer); heartbeatTimer = null;
    clearInterval(destroyTimer); destroyTimer = null;
    destroying = false;
    $("destroyMask").classList.remove("show");
    roomId = null;
    messages.innerHTML = "";
    renderedClientIds.clear();
    chatroom.style.display = "none";
    lobby.style.display = "flex";
    setStatus(msg || "", "");
  }

  /* ---------- 创建房间 ---------- */
  $("createBtn").addEventListener("click", async () => {
    const msg = $("createMsg");
    if (!API_ON) { msg.textContent = "后端未配置"; msg.className = "msg-line err"; return; }
    if (!isLoggedIn) {
      msg.textContent = "需要登录后才能创建房间";
      msg.className = "msg-line err";
      toast("请先到游戏屋首页登录 / 注册");
      return;
    }
    const btn = $("createBtn"); btn.disabled = true;
    try {
      let rid = genRoomId();
      for (let i = 0; i < 10; i++) {
        const dup = await API.get("chat_rooms", "room_id=eq." + rid + "&select=room_id");
        if (!dup.length) break;
        rid = genRoomId();
      }
      roomTitle = "悄悄话 · " + rid;
      await API.post("chat_rooms", { room_id: rid, owner: accountName, status: "active", title: roomTitle });
      msg.textContent = "房间创建成功：" + rid;
      msg.className = "msg-line ok";
      toast("房间 " + rid + " 已创建，把房间号发给朋友吧");
      enterRoom(rid, accountName);
    } catch (e) {
      msg.textContent = "创建失败：" + e.message;
      msg.className = "msg-line err";
    } finally { btn.disabled = false; }
  });

  /* ---------- 加入房间 ---------- */
  async function joinRoom() {
    const msg = $("joinMsg");
    const val = $("joinInput").value.trim();
    if (!API_ON) { msg.textContent = "后端未配置"; msg.className = "msg-line err"; return; }
    if (!/^\d{4,8}$/.test(val)) { msg.textContent = "请输入 4-8 位数字房间号"; msg.className = "msg-line err"; return; }
    const btn = $("joinBtn"); btn.disabled = true;
    try {
      const rows = await API.get("chat_rooms", "room_id=eq." + val + "&select=room_id,owner,status,title");
      if (!rows.length) { msg.textContent = "房间不存在，请检查房间号"; msg.className = "msg-line err"; return; }
      if (rows[0].status !== "active") { msg.textContent = "房间已解散"; msg.className = "msg-line err"; return; }
      msg.textContent = "加入成功！";
      msg.className = "msg-line ok";
      enterRoom(val, rows[0].owner, rows[0].title);
    } catch (e) {
      msg.textContent = "加入失败：" + e.message;
      msg.className = "msg-line err";
    } finally { btn.disabled = false; }
  }
  $("joinBtn").addEventListener("click", joinRoom);
  $("joinInput").addEventListener("keydown", e => { if (e.key === "Enter") joinRoom(); });

  /* ---------- 进入房间 ---------- */
  async function enterRoom(rid, owner, title) {
    roomId = rid; roomOwner = owner || ""; roomTitle = title || "";
    destroying = false;
    clearInterval(destroyTimer);
    $("destroyMask").classList.remove("show");
    membersReady = false;
    membersCache = [];
    myNick = randomNick();   // 每次进房重新随机昵称
    $("roomBadge").textContent = rid;
    $("roomTitle").textContent = roomTitle || ("悄悄话 · " + rid);
    messages.innerHTML = "";
    renderedClientIds.clear();
    lastMsgId = 0;
    showChat();
    setStatus("已进入房间 " + rid + "，你的昵称：", "#3ecf8e");
    status.textContent = "已进入房间 " + rid + " · 你的昵称：「" + myNick + "」";
    addSystem("你以「" + myNick + "」的身份进入了房间，开始私密聊天吧");
    addSystem("新成员只能看到进入后的消息，历史消息不展示");

    try {
      // 只拉比当前最新 id 更大的消息（新人不见历史）
      const rows = await API.get("chat_messages", "room_id=eq." + rid + "&order=id.desc&limit=1&select=id");
      if (rows.length) lastMsgId = rows[0].id;
    } catch(e) {}

    // 立即上报在线（随机昵称）
    try { await API.post("chat_presence", { room_id: rid, username: myNick }); } catch(e) {}

    poll();
    pollTimer = setInterval(poll, 2000);
    heartbeatTimer = setInterval(heartbeat, 5000);
    input.focus();
  }

  /* 心跳：刷新自己在线状态 */
  async function heartbeat() {
    if (!roomId) return;
    try { await API.patch("chat_presence", "room_id=eq." + roomId + "&username=eq." + encodeURIComponent(myNick), { last_seen: new Date().toISOString() }); } catch(e) {}
  }

  /* 在线成员列表（最近 15 秒活跃，跟随 2 秒轮询刷新） */
  let membersCache = [];
  let membersReady = false;   // 首次建立基线，不产生"进入"提醒
  async function refreshMembers() {
    if (!roomId) return;
    const since = new Date(Date.now() - 15000).toISOString();
    const rows = await API.get("chat_presence", "room_id=eq." + roomId + "&last_seen=gt." + since + "&select=username");
    const nowList = rows.map(r => r.username);
    if (membersReady) {
      // diff：新出现的人 → 进入提醒；消失的人 → 退出提醒（排除自己）
      const entered = nowList.filter(n => n !== myNick && !membersCache.includes(n));
      const left = membersCache.filter(n => n !== myNick && !nowList.includes(n));
      for (const n of entered) addSystem("👋 " + n + " 已进入房间");
      for (const n of left) addSystem("👋 " + n + " 已退出房间");
    } else {
      membersReady = true;
    }
    membersCache = nowList;
    renderMembers();
  }

  function renderMembers() {
    memcount.textContent = membersCache.length;
    memlist.innerHTML = "";
    const list = [...membersCache].sort((a,b) => a===myNick ? -1 : b===myNick ? 1 : a.localeCompare(b));
    for (const n of list) {
      const li = document.createElement("li");
      li.textContent = n + (n === myNick ? "（我）" : "") + (n === roomOwner ? " 👑" : "");
      if (n === myNick) li.className = "me-item";
      else if (n === roomOwner) li.className = "owner-item";
      li.title = "双击 @ " + n;
      li.addEventListener("dblclick", () => { mention(n); });
      memlist.appendChild(li);
    }
  }

  /* @ 某人：双击名字把 @昵称 插入输入框 */
  function mention(name) {
    const cur = input.value.trim();
    input.value = cur ? cur + " @" + name + " " : "@" + name + " ";
    input.focus();
    const len = input.value.length;
    input.setSelectionRange(len, len);
    toast("已 @ " + name);
  }

  /* ---------- 轮询拉取新消息 ---------- */
  async function poll() {
    if (!roomId) return;
    try {
      const q = "room_id=eq." + roomId + "&id=gt." + lastMsgId + "&order=id.asc&limit=50&select=id,room_id,sender,content,ttl,client_id,created_at";
      const rows = await API.get("chat_messages", q);
      for (const m of rows) {
        if (m.client_id && renderedClientIds.has(m.client_id)) continue;  // 去重
        lastMsgId = Math.max(lastMsgId, m.id);
        if (m.client_id) renderedClientIds.add(m.client_id);
        addMessage(m);
      }
    } catch(e) { /* 房间可能被销毁，下一轮检查 */ }
    // 每次轮询都同步成员列表（秒刷进出）
    try { await refreshMembers(); } catch(e) {}
    // 检查房间存活状态（房主销毁等）
    try { await checkRoomAlive(); } catch(e) {}
  }

  /* 检查房间状态：destroying → 全员倒计时销毁；不存在 → 返回首页 */
  let destroying = false;
  let destroyTimer = null;
  async function checkRoomAlive() {
    if (!roomId || destroying) return;
    const rows = await API.get("chat_rooms", "room_id=eq." + roomId + "&select=room_id,status,destroy_at");
    if (!rows.length || rows[0].status === "closed") {
      // 房间已删/关闭：直接回大厅
      toast("房间已被销毁");
      goLobby("房间已被销毁，返回大厅");
      return;
    }
    if (rows[0].status === "destroying") {
      // 房主已退出，开始 5 秒销毁倒计时（destroy_at 由房主写入）
      const destroyAt = rows[0].destroy_at ? new Date(rows[0].destroy_at).getTime() : Date.now() + 5000;
      startDestroyCountdown(destroyAt);
    }
  }

  /* 全员销毁倒计时 */
  function startDestroyCountdown(destroyAt) {
    if (destroying) return;
    destroying = true;
    const mask = $("destroyMask"), numEl = $("destroyNum");
    mask.classList.add("show");
    clearInterval(destroyTimer);
    const tick = () => {
      const remain = Math.max(0, Math.ceil((destroyAt - Date.now()) / 1000));
      numEl.textContent = remain;
      if (remain <= 0) {
        clearInterval(destroyTimer);
        setTimeout(() => {
          // 强制销毁：删除房间（房主身份或任何成员都尝试），级联清消息/presence
          API.del("chat_rooms", "room_id=eq." + roomId).then(() => {
            goLobby("房间已销毁");
          }).catch(() => {
            goLobby("房间已销毁");
          });
        }, 600);
      }
    };
    tick();
    destroyTimer = setInterval(tick, 200);
  }

  /* ================= 消息渲染 ================= */
  function addSystem(text) {
    const el = document.createElement("div");
    el.className = "sys";
    el.textContent = text;
    messages.appendChild(el);
    scheduleRemove(el, 20000);
    scroll();
  }

  function addMessage(msg) {
    const mine = msg.sender === myNick;
    const ttl = (typeof msg.ttl === "number" && msg.ttl >= 0) ? msg.ttl : 20000;
    const perm = ttl === 0;
    const row = document.createElement("div");
    row.className = "row" + (mine ? " mine" : "") + (perm ? " perm" : "");

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = mine ? "我" : (msg.sender || "匿名");
    name.title = "双击 @ " + (msg.sender || "");
    if (!mine) {
      name.addEventListener("dblclick", () => { mention(msg.sender); });
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = msg.content;
    if (!perm) {
      const bar = document.createElement("div");
      bar.className = "bar";
      bar.style.animationDuration = (ttl / 1000) + "s";
      bubble.appendChild(bar);
    } else {
      const pt = document.createElement("div");
      pt.className = "perm-tag";
      pt.textContent = "∞ 永久";
      bubble.appendChild(pt);
    }

    row.appendChild(name);
    row.appendChild(bubble);
    messages.appendChild(row);
    if (!perm) scheduleRemove(row, ttl);
    scroll();
  }

  function scheduleRemove(el, ms) {
    setTimeout(() => el.classList.add("fade"), Math.max(0, ms - 600));
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, ms);
  }
  function scroll() { messages.scrollTop = messages.scrollHeight; }

  /* ================= 发送 ================= */
  function send() {
    const text = input.value.trim();
    if (!text || !roomId) return;
    const ttl = parseInt(ttlSel.value, 10) || 0;
    const clientId = Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    // 乐观渲染自己的消息（带 client_id，轮询去重）
    renderedClientIds.add(clientId);
    addMessage({ id: 0, sender: myNick, content: text, ttl, client_id: clientId, created_at: new Date().toISOString() });
    const body = { room_id: roomId, sender: myNick, content: text, ttl, client_id: clientId };
    API.post("chat_messages", body).then(() => {}).catch(() => toast("发送失败，请重试"));
    input.value = "";
    input.focus();
  }
  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

  /* ================= 清屏（仅本地） ================= */
  $("clearBtn").addEventListener("click", () => {
    messages.innerHTML = "";
    addSystem("🧹 屏幕已清空（仅你本地，不影响他人）");
  });

  /* ================= 复制房间号 ================= */
  $("shareBtn").addEventListener("click", async () => {
    if (!roomId) return;
    let ok = false;
    try { await navigator.clipboard.writeText(roomId); ok = true; }
    catch {
      try {
        const ta = document.createElement("textarea");
        ta.value = roomId; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        ok = document.execCommand("copy");
        document.body.removeChild(ta);
      } catch { ok = false; }
    }
    toast(ok ? "房间号 " + roomId + " 已复制" : "复制失败，请手动记下 " + roomId);
  });

  /* ================= 房间名设置（房主） ================= */
  const mask = $("mask"), nameInput = $("roomNameInput");
  $("renameBtn").addEventListener("click", () => {
    if (roomOwner !== accountName) { toast("只有房主可以设置房间名"); return; }
    nameInput.value = roomTitle || "";
    mask.classList.add("show");
    setTimeout(() => nameInput.focus(), 50);
  });
  $("nameCancel").addEventListener("click", () => mask.classList.remove("show"));
  mask.addEventListener("click", e => { if (e.target === mask) mask.classList.remove("show"); });
  $("nameOk").addEventListener("click", async () => {
    const t = nameInput.value.trim().slice(0, 20);
    if (!t) { toast("房间名不能为空"); return; }
    try {
      await API.patch("chat_rooms", "room_id=eq." + roomId, { title: t });
      roomTitle = t;
      $("roomTitle").textContent = t;
      mask.classList.remove("show");
      addSystem("房主将房间名改为「" + t + "」");
      toast("房间名已更新");
    } catch (e) { toast("保存失败：" + e.message); }
  });

  /* ================= 退出 / 销毁 ================= */
  $("leaveBtn").addEventListener("click", async () => {
    const isOwner = roomOwner === accountName;
    if (isOwner) {
      if (!confirm("你是房主，退出将销毁房间，所有消息将被清除。确定吗？")) return;
      const destroyAt = Date.now() + 5000;
      try {
        // 置销毁状态 + 写销毁时刻 → 全员（含自己）进入倒计时
        await API.patch("chat_rooms", "room_id=eq." + roomId, { status: "destroying", destroy_at: new Date(destroyAt).toISOString() });
        startDestroyCountdown(destroyAt);
      } catch (e) { toast("操作失败：" + e.message); }
    } else {
      goLobby("已退出房间");
    }
  });

  /* ================= 初始化 ================= */
  function init() {
    if (!API_ON) { setStatus("后端未配置，聊天不可用", "#ff6b6b"); }
    else if (isLoggedIn) {
      setStatus("已登录：" + accountName, "#3ecf8e");
      $("whoami").textContent = accountName;
      $("guestNote").innerHTML = "";
    } else {
      $("whoami").textContent = isGuest ? (accountName || "游客") : "";
      setStatus(isGuest ? "当前为游客身份" : "未登录", "#f0b429");
      $("guestNote").innerHTML = "当前是<b>游客身份</b>，可以直接输入房间号加入朋友开的房间；要<b>创建自己的房间</b>，请先到游戏屋首页 <a href=\"../\">登录 / 注册</a>。";
    }
  }
  init();
})();
</script>
</body>
</html>
