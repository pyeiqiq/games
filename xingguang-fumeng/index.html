/* ---------------- [M11] engine 跑酷引擎 ---------------- */
XGF.engine = {
  cv:null, ctx:null, W:0, H:0, dpr:1,
  levelIdx:0, meta:null, theme:'dawn',
  worldX:0, dist:0, speed:0,
  playerX:0, keys:{left:false,right:false},
  objs:[], parts:[], bgStars:[],
  state:'idle', paused:false, raf:0, lastT:0, runTime:0, bubbleTimer:0,
  blurTO:null, shakeTO:null, shadeTO:null,

  start(levelId){
    const idx = XGF.LEVEL_META.findIndex(m => m.id === levelId);
    if(idx < 0) return;
    this.levelIdx = idx;
    this.meta = XGF.LEVEL_META[idx];
    this.theme = this.meta.theme;
    this.state = 'ready';
    this.paused = false;
    this.runTime = 0;
    this.bubbleTimer = XGF.rand(5,9);
    /* 本局状态：分数 / 跳跃 / 特效 */
    this.score = 0;
    this.playerY = 0; this.jumping = false; this.jumpV = 0;
    this.rainT = 0; this.rainSeed = 0; this.lightningT = 0; this.comp = null;
    XGF.$('#scoreNum').textContent = '0';
    XGF.router.show('game');
    this.setupCanvas();
    this.buildEggShuffle();
    this.buildLevel();
    this.renderOnce();
    this.bindGameEvents();
    XGF.game.showHud();
    XGF.tips.show(true); // 进入游戏，确认后开跑
  },

  setupCanvas(){
    this.cv = XGF.$('#gameCanvas');
    this.ctx = this.cv.getContext('2d');
    this.resize();
  },
  resize(){
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.W = window.innerWidth; this.H = window.innerHeight;
    this.cv.width = this.W * this.dpr;
    this.cv.height = this.H * this.dpr;
    this.cv.style.width = this.W + 'px';
    this.cv.style.height = this.H + 'px';
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.groundY = this.H * 0.74;
    this.playerX = this.W * 0.3;
    if(this.state === 'run' || this.state === 'finish') this.renderOnce();
  },

  buildLevel(){
    const m = this.meta;
    this.dist = m.dur * m.speed;
    this.worldX = 0;
    this.speed = m.speed;
    this.objs = [];
    this.parts = [];
    /* 背景远星（视差） */
    this.bgStars = [];
    const dark = document.body.dataset.theme === 'dark';
    const n = Math.floor(this.W / 26);
    for(let i=0;i<n;i++){
      this.bgStars.push({ x:Math.random()*this.W, y:Math.random()*this.groundY*0.75,
        r:XGF.rand(0.6,1.8), p:XGF.rand(0.2,0.6), tw:XGF.rand(1.5,4) });
    }
    /* 生成障碍物 */
    const obs = m.obstacles || {};
    this.spawnType('fog', obs.fog || 0);
    this.spawnType('rock', obs.rock || 0);
    this.spawnType('wood', obs.wood || 0);
    this.spawnType('grass', obs.grass || 0);
    this.spawnType('cloud', obs.cloud || 0);
    /* 生成星光（45% 高星需跳跃收集，其余低星跑过即拾） */
    const starN = XGF.STAR_DENSITY[m.stars] || 30;
    for(let i=0;i<starN;i++){
      const high = Math.random() < 0.45;
      this.objs.push({ type:'star', x:XGF.rand(160, this.dist-260),
        y: high ? XGF.rand(this.groundY-155, this.groundY-95) : XGF.rand(this.groundY-80, this.groundY-32),
        r:XGF.rand(5,8), phase:XGF.rand(0,6.28), got:false, high });
    }
    /* 按 x 排序，避免闪烁重叠 */
    this.objs.sort((a,b) => a.x - b.x);
    /* 本关彩蛋池（家长配置平均分配） */
    this.buildEggPool();
  },
  /* 每局只洗牌一次：彩蛋顺序固定，但每关从全池随机抽取 */
  buildEggShuffle(){
    const cfg = XGF.getConfig();
    const eggs = (cfg.eggs && cfg.eggs.length) ? cfg.eggs : XGF.DEFAULT_EGGS;
    this._shuffledEggs = eggs.slice().sort(() => Math.random() - 0.5);
  },
  buildEggPool(){
    /* 不做平均分配：每关气泡从全部彩蛋中随机抽取任意一条 */
    this.eggPool = this._shuffledEggs.slice();
  },
  spawnType(type, n){
    for(let i=0;i<n;i++){
      const x = XGF.rand(260, this.dist-220);
      const o = { type, x, used:false };
      if(type === 'fog'){ o.r = XGF.rand(55, 95); o.y = XGF.rand(this.groundY-80, this.groundY-28); o.alpha = XGF.rand(0.18, 0.34); }
      else if(type === 'rock'){ o.y = this.groundY - XGF.rand(3, 8); o.s = XGF.rand(8, 15); }
      else if(type === 'wood'){ o.y = this.groundY - 4; o.w = XGF.rand(26, 42); o.r = XGF.rand(7, 11); }
      else if(type === 'grass'){ o.y = this.groundY; o.s = XGF.rand(10, 15); }
      else if(type === 'cloud'){ o.r = XGF.rand(42, 66); o.y = XGF.rand(this.H*0.06, this.H*0.3); o.alpha = XGF.rand(0.32, 0.5); }
      this.objs.push(o);
    }
  },

  bindGameEvents(){
    if(this._bound) return;
    this._bound = true;
    window.addEventListener('resize', () => { if(this.state !== 'idle') this.resize(); });
    /* 触屏：左右滑=移动，上滑或单击=跳跃 */
    let tX = null, tY = null, tT = 0, tMoved = false, tSwiped = false;
    this.cv.addEventListener('touchstart', e => {
      if(this.state !== 'run' || this.paused) return;
      const t = e.touches[0];
      tX = t.clientX; tY = t.clientY; tT = Date.now(); tMoved = false; tSwiped = false;
    }, {passive:true});
    this.cv.addEventListener('touchmove', e => {
      if(this.state !== 'run' || this.paused || tX === null) return;
      e.preventDefault();
      const t = e.touches[0];
      const dx = (t.clientX - tX) * 1.25;
      const dy = t.clientY - tY;
      if(dy < -16 && !tSwiped){ this.jump(); tSwiped = true; }
      else if(Math.abs(dy) < 24) this.movePlayer(dx);
      if(Math.abs(dx) > 10) tMoved = true;
      tX = t.clientX; tY = t.clientY;
    }, {passive:false});
    this.cv.addEventListener('touchend', () => {
      if(tX !== null && !tSwiped && !tMoved && Date.now() - tT < 320) this.jump();
      tX = null;
    });
    /* 键盘：左右移动，空格/↑/W=跳跃 */
    window.addEventListener('keydown', e => {
      if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A'){ this.keys.left = true; }
      if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D'){ this.keys.right = true; }
      if(e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W'){ e.preventDefault(); this.jump(); }
    });
    window.addEventListener('keyup', e => {
      if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A'){ this.keys.left = false; }
      if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D'){ this.keys.right = false; }
    });
  },
  jump(){
    if(this.state !== 'run' || this.paused || this.jumping) return;
    this.jumping = true;
    this.jumpV = -380;
    XGF.audio.sfx('jump');
  },
  addScore(n, sx, sy){
    this.score = Math.max(0, this.score + n);
    XGF.$('#scoreNum').textContent = this.score;
    this.parts.push({ type:'text', text:(n>0?'+':'')+n, x:sx, y:sy, life:0.9, c:n>0?'#FFE9A8':'#FFB4A8' });
  },
  burstParticles(x, y){
    for(let i=0;i<12;i++){
      const a = XGF.rand(0, Math.PI*2), sp = XGF.rand(50, 160);
      this.parts.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 60, g:220,
        life:XGF.rand(0.3,0.6), r:XGF.rand(1.5,3.5), c:XGF.pick(['#FFE9A8','#FFD98A','#FFC46A','#B8A7CE']) });
    }
  },
  movePlayer(dx){
    const min = 40, max = this.W - 40;
    this.playerX = XGF.clamp(this.playerX + dx, min, max);
  },

  run(){ // 用户确认提示后开跑
    this.state = 'run';
    this.lastT = performance.now();
    XGF.audio.startBGM();
    cancelAnimationFrame(this.raf);
    const loop = (t) => {
      this.raf = requestAnimationFrame(loop);
      const dt = Math.min((t - this.lastT) / 1000, 0.05);
      this.lastT = t;
      if(this.paused || this.state !== 'run'){ this.renderOnce(); return; }
      this.update(dt);
      this.render();
    };
    this.raf = requestAnimationFrame(loop);
  },
  pause(){
    this.paused = true;
    XGF.$('#pauseMask').classList.add('show');
    XGF.audio.stopBGM();
  },
  resume(){
    this.paused = false;
    this.lastT = performance.now();
    XGF.$('#pauseMask').classList.remove('show');
    XGF.audio.startBGM();
  },

  update(dt){
    this.worldX += this.speed * dt;
    this.runTime += dt;
    /* 键盘移动 */
    if(this.keys.left) this.movePlayer(-this.speed * dt * 1.1);
    if(this.keys.right) this.movePlayer(this.speed * dt * 1.1);
    /* 跳跃物理 */
    if(this.jumping){
      this.jumpV += 1000 * dt;
      this.playerY += this.jumpV * dt;
      if(this.playerY >= 0){ this.playerY = 0; this.jumping = false; }
    }
    /* 特效计时 */
    if(this.rainT > 0) this.rainT -= dt;
    if(this.lightningT > 0) this.lightningT -= dt;
    /* 爸妈陪伴小人 */
    if(this.comp){
      const c = this.comp;
      c.t -= dt; c.runT += dt;
      const targetX = this.playerX - 86;
      if(c.x < targetX) c.x = Math.min(targetX, c.x + this.speed * dt * 1.3);
      if(c.t <= 0){ if(c.fade === undefined) c.fade = 1; c.fade -= dt * 1.2; if(c.fade <= 0) this.comp = null; }
    }
    /* 背景星视差滚动 */
    for(const s of this.bgStars){
      s.x -= this.speed * dt * 0.22;
      if(s.x < -4){ s.x = this.W + 4; s.y = Math.random() * this.groundY * 0.75; }
    }
    /* 对象（y 轴判定：跳跃可跳过障碍/碰到高星） */
    const cy = this.groundY - 44 + this.playerY; /* playerY 为负=向上 */
    for(let i=this.objs.length-1; i>=0; i--){
      const o = this.objs[i];
      if(o.x - this.worldX < -160){ this.objs.splice(i,1); continue; }
      if(o.used || o.got) continue;
      const sx = o.x - this.worldX;
      if(sx < this.W + 120){
        const pMin = this.playerX - 36, pMax = this.playerX + 36;
        if(sx > pMin - 8 && sx < pMax + 8){
          if(o.type === 'star'){
            if(Math.abs(o.y - cy) < 46) this.collect(o, sx);
          } else if(o.type === 'cloud'){
            if(!o.used){ this.hitObstacle(o); o.used = true; } /* 高空云，经过触发遮挡 */
          } else {
            if(!o.used && Math.abs(o.y - cy) < 52){ this.hitObstacle(o); o.used = true; }
          }
        }
      }
    }
    /* 粒子（含飘字） */
    for(let i=this.parts.length-1; i>=0; i--){
      const p = this.parts[i];
      if(p.type === 'text'){ p.life -= dt; if(p.life <= 0) this.parts.splice(i,1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += p.g * dt; p.life -= dt;
      if(p.life <= 0) this.parts.splice(i,1);
    }
    /* 随机暖心气泡（普通 + 特殊球） */
    this.bubbleTimer -= dt;
    if(this.bubbleTimer <= 0){
      XGF.game.bubble();
      this.bubbleTimer = XGF.rand(8, 15);
    }
    /* 通关检测 */
    if(this.worldX >= this.dist) this.finish();
  },

  special(kind){
    if(kind === 'bolt'){
      this.lightningT = 0.8;
      XGF.audio.sfx('thunder');
    } else if(kind === 'rain'){
      this.rainT = 3;
      this.rainSeed = Math.floor(Math.random() * 1000);
      XGF.audio.sfx('rain');
    } else if(kind === 'dad' || kind === 'mom'){
      this.comp = { type:kind, x:this.playerX - 280, t:7, runT:0 };
      XGF.audio.sfx('companion');
    }
  },

  collect(o, sx){
    o.got = true;
    XGF.audio.sfx('collect');
    this.addScore(10, sx, o.y);
    const cx = sx, cy = o.y;
    for(let i=0;i<7;i++){
      const a = XGF.rand(0, Math.PI*2), sp = XGF.rand(30, 90);
      this.parts.push({ x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-40, g:160,
        life:XGF.rand(0.3,0.55), r:XGF.rand(1.6,3.2), c:'#FFE9A8' });
    }
  },
  hitObstacle(o){
    if(o.type === 'fog'){
      XGF.audio.sfx('hit');
      this.addScore(-5, o.x - this.worldX, o.y - 24);
      const wrap = XGF.$('#gameWrap');
      wrap.classList.add('blur');
      clearTimeout(this.blurTO);
      this.blurTO = setTimeout(() => wrap.classList.remove('blur'), 1000);
    } else if(o.type === 'cloud'){
      /* 高空乌云：仅遮挡效果，不扣分（无法跳过） */
      const fx = XGF.$('#fxLayer');
      fx.classList.add('shade');
      clearTimeout(this.shadeTO);
      this.shadeTO = setTimeout(() => fx.classList.remove('shade'), 3000);
    } else { /* rock / wood / grass 地面障碍 */
      XGF.audio.sfx('hit');
      this.addScore(-5, o.x - this.worldX, o.y - 34);
      const wrap = XGF.$('#gameWrap');
      wrap.classList.add('shake');
      clearTimeout(this.shakeTO);
      this.shakeTO = setTimeout(() => wrap.classList.remove('shake'), 350);
    }
  },

  finish(){
    this.state = 'finish';
    XGF.audio.stopBGM();
    XGF.audio.sfx('clear');
    XGF.$('#fadeWhite').classList.add('on');
    /* 星光汇聚粒子：从四周飞向角色 */
    const cx = this.playerX, cy = this.groundY - 44;
    for(let i=0;i<46;i++){
      const a = XGF.rand(0, Math.PI*2);
      const d = XGF.rand(this.W*0.3, this.W*0.75);
      this.parts.push({ x:cx + Math.cos(a)*d, y:cy + Math.sin(a)*d,
        vx:(cx-(cx+Math.cos(a)*d))*2.2, vy:(cy-(cy+Math.sin(a)*d))*2.2, g:0,
        life:XGF.rand(1.1, 1.8), r:XGF.rand(2, 4.5), c:'#FFE9A8' });
    }
    setTimeout(() => { this.state = 'done'; XGF.game.onClear(); }, 2900);
  },
  renderOnce(){ this.render(); },

  /* ---------- 渲染 ---------- */
  render(){
    const c = this.ctx, W = this.W, H = this.H;
    const dark = document.body.dataset.theme === 'dark';
    const sky = XGF.SKIES[this.theme][dark ? 'dark' : 'light'];
    const g = c.createLinearGradient(0, 0, 0, this.groundY);
    g.addColorStop(0, sky[0]); g.addColorStop(0.65, sky[1]); g.addColorStop(1, sky[2]);
    c.fillStyle = g;
    c.fillRect(0, 0, W, this.groundY);
    this.drawLight();
    this.drawBgStars();
    this.drawLightning();
    this.drawGround();
    /* 对象 */
    for(const o of this.objs){
      const sx = o.x - this.worldX;
      if(sx < -140 || sx > W + 140) continue;
      if(o.type === 'star'){ if(!o.got) this.drawStar(o, sx); }
      else if(!o.used) this.drawObstacle(o, sx);
    }
    this.drawLighthouse();
    this.drawCompanion();
    this.drawPlayer();
    this.drawRain();
    this.drawParticles();
  },
  drawLight(){
    /* 主题光晕（月/日/晨光） */
    const c = this.ctx;
    const x = this.W * 0.82, y = this.H * 0.16;
    const colors = {
      dawn:'rgba(255,214,150,0.55)', morning:'rgba(255,240,214,0.6)',
      night:'rgba(233,228,214,0.5)', bright:'rgba(255,238,200,0.55)',
      galaxy:'rgba(216,208,255,0.4)', final:'rgba(255,224,170,0.5)'
    };
    const g = c.createRadialGradient(x, y, 4, x, y, 90);
    g.addColorStop(0, colors[this.theme] || 'rgba(255,240,214,0.5)');
    g.addColorStop(1, 'rgba(255,240,214,0)');
    c.fillStyle = g;
    c.fillRect(x-95, y-95, 190, 190);
  },
  drawBgStars(){
    const c = this.ctx;
    const dark = document.body.dataset.theme === 'dark';
    c.fillStyle = dark ? '#FFE9A8' : '#FFF7DC';
    for(const s of this.bgStars){
      const a = 0.25 + 0.6 * Math.abs(Math.sin((performance.now()/1000)*s.tw + s.p));
      c.globalAlpha = a;
      c.beginPath(); c.arc(s.x, s.y, s.r, 0, 6.28); c.fill();
    }
    c.globalAlpha = 1;
  },
  drawGround(){
    const c = this.ctx, W = this.W;
    const dark = document.body.dataset.theme === 'dark';
    const gcol = XGF.GROUNDS[this.theme];
    const base = dark ? this.darken(gcol) : gcol;
    c.fillStyle = base;
    c.fillRect(0, this.groundY, W, this.H - this.groundY);
    /* 顶部柔光 */
    c.fillStyle = dark ? 'rgba(255,255,255,0.07)' : 'rgba(255,255,255,0.45)';
    c.fillRect(0, this.groundY, W, 3);
    /* 地面星点 */
    c.fillStyle = dark ? 'rgba(255,233,168,0.2)' : 'rgba(255,255,255,0.5)';
    for(let i=0;i<26;i++){
      const gx = ((i*137 + 53) % W);
      const gy = this.groundY + 14 + ((i*89) % (this.H - this.groundY - 22));
      c.globalAlpha = 0.4 + 0.6*Math.abs(Math.sin(i*1.7 + performance.now()/1400));
      c.beginPath(); c.arc(gx, gy, 1.2, 0, 6.28); c.fill();
    }
    c.globalAlpha = 1;
  },
  darken(hex){
    /* 简易加深 */
    const n = parseInt(hex.slice(1), 16);
    const r = Math.floor(((n>>16)&255)*0.42), g = Math.floor(((n>>8)&255)*0.42), b = Math.floor((n&255)*0.42);
    return 'rgb('+r+','+g+','+b+')';
  },
  drawObstacle(o, sx){
    const c = this.ctx;
    const dark = document.body.dataset.theme === 'dark';
    if(o.type === 'fog'){
      const g = c.createRadialGradient(sx, o.y, 4, sx, o.y, o.r);
      g.addColorStop(0, 'rgba(236,240,248,'+o.alpha+')');
      g.addColorStop(1, 'rgba(236,240,248,0)');
      c.fillStyle = g;
      c.beginPath(); c.arc(sx, o.y, o.r, 0, 6.28); c.fill();
    } else if(o.type === 'rock'){
      c.fillStyle = dark ? '#4A5264' : '#9BA4B0';
      const y = o.y;
      c.beginPath();
      c.moveTo(sx - o.s, y);
      c.lineTo(sx - o.s*0.3, y - o.s*0.9);
      c.lineTo(sx + o.s*0.6, y - o.s*0.5);
      c.lineTo(sx + o.s, y);
      c.closePath(); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.25)';
      c.beginPath(); c.arc(sx - o.s*0.25, y - o.s*0.5, o.s*0.16, 0, 6.28); c.fill();
    } else if(o.type === 'wood'){
      /* 横放圆木 */
      c.fillStyle = dark ? '#6E543C' : '#A97B54';
      this.roundRect(sx - o.w/2, o.y - o.r, o.w, o.r*2, o.r); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.14)';
      this.roundRect(sx - o.w/2, o.y - o.r, o.w, o.r*0.6, o.r); c.fill();
      c.strokeStyle = dark ? 'rgba(0,0,0,0.3)' : 'rgba(122,82,52,0.55)';
      c.lineWidth = 1.6;
      c.beginPath(); c.arc(sx, o.y, o.r*0.4, 0, 6.28); c.stroke();
      c.beginPath(); c.arc(sx, o.y, o.r*0.18, 0, 6.28); c.stroke();
    } else if(o.type === 'grass'){
      /* 小草丛 */
      const n = 4;
      c.fillStyle = dark ? '#4E6E56' : '#7BA77F';
      for(let k=0;k<n;k++){
        const gx = sx - o.s*0.5 + (o.s/n)*(k+0.5);
        const h = o.s * (0.6 + ((k*37)%30)/100);
        c.beginPath();
        c.moveTo(gx - 4, o.y);
        c.quadraticCurveTo(gx - 6, o.y - h*0.7, gx - 2, o.y - h);
        c.quadraticCurveTo(gx + 1, o.y - h*0.7, gx + 4, o.y);
        c.fill();
      }
      c.fillStyle = dark ? '#5F8166' : '#93BE97';
      c.beginPath();
      c.moveTo(sx - 2, o.y);
      c.quadraticCurveTo(sx - 5, o.y - o.s*0.9, sx, o.y - o.s*1.05);
      c.quadraticCurveTo(sx + 5, o.y - o.s*0.9, sx + 2, o.y);
      c.fill();
    } else if(o.type === 'cloud'){
      c.fillStyle = 'rgba(24,30,48,'+o.alpha+')';
      c.beginPath();
      c.arc(sx - o.r*0.5, o.y, o.r*0.55, 0, 6.28);
      c.arc(sx, o.y - o.r*0.2, o.r*0.7, 0, 6.28);
      c.arc(sx + o.r*0.5, o.y, o.r*0.55, 0, 6.28);
      c.fill();
    }
  },
  drawStar(o, sx){
    const c = this.ctx;
    const a = 0.5 + 0.5 * Math.sin(performance.now()/400 + o.phase);
    const y = o.y + Math.sin(performance.now()/600 + o.phase) * 3;
    const r = o.r * (0.85 + 0.3*a);
    const g = c.createRadialGradient(sx, y, 1, sx, y, r*3);
    g.addColorStop(0, 'rgba(255,238,180,0.9)');
    g.addColorStop(0.4, 'rgba(255,226,140,0.35)');
    g.addColorStop(1, 'rgba(255,226,140,0)');
    c.fillStyle = g;
    c.beginPath(); c.arc(sx, y, r*3, 0, 6.28); c.fill();
    /* 四角星 */
    c.fillStyle = 'rgba(255,244,205,0.95)';
    this.starPath(sx, y, r, r*2.1);
    c.fill();
  },
  starPath(x, y, rIn, rOut){
    const c = this.ctx;
    c.beginPath();
    for(let i=0;i<8;i++){
      const rr = i%2===0 ? rOut : rIn;
      const a = (i/8)*Math.PI*2 - Math.PI/2;
      const px = x + Math.cos(a)*rr, py = y + Math.sin(a)*rr;
      if(i===0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.closePath();
  },
  drawLighthouse(){
    /* 终点暖光灯塔：屏幕右侧随世界接近 */
    const c = this.ctx, W = this.W;
    const sx = this.dist - this.worldX;
    if(sx > W + 200 || this.state === 'done') return;
    const lx = sx, gy = this.groundY;
    const light = XGF.clamp(1 - (sx - W*0.3)/W, 0, 1); /* 越近越亮 */
    /* 光柱 */
    const g = c.createLinearGradient(lx, 0, lx, gy);
    g.addColorStop(0, 'rgba(255,224,160,' + (0.28*light) + ')');
    g.addColorStop(1, 'rgba(255,224,160,0)');
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(lx-46, 0); c.lineTo(lx+46, 0); c.lineTo(lx+130, gy); c.lineTo(lx-130, gy);
    c.closePath(); c.fill();
    /* 塔身 */
    c.fillStyle = '#8A93A8';
    c.fillRect(lx-12, gy-110, 24, 110);
    c.fillStyle = '#6E778C';
    c.fillRect(lx-18, gy-120, 36, 14);
    /* 灯 */
    const lg = c.createRadialGradient(lx, gy-126, 2, lx, gy-126, 26 + 14*light);
    lg.addColorStop(0, 'rgba(255,238,180,0.95)');
    lg.addColorStop(1, 'rgba(255,238,180,0)');
    c.fillStyle = lg;
    c.beginPath(); c.arc(lx, gy-126, 26 + 14*light, 0, 6.28); c.fill();
    c.fillStyle = '#FFE9A8';
    c.beginPath(); c.arc(lx, gy-126, 8, 0, 6.28); c.fill();
  },
  drawPlayer(){
    const c = this.ctx;
    const cfg = XGF.getConfig();
    const gender = (cfg.profile && cfg.profile.gender) || 'neutral';
    const colors = {
      neutral:{ cloth:'#B8A7CE', clothD:'#9E8AB8', hair:'#8B6B4A', hairD:'#75583C', skin:'#F6D9C4' },
      boy:{ cloth:'#7FA8C9', clothD:'#5F8AB0', hair:'#3A3A44', hairD:'#2A2A32', skin:'#F6D9C4' },
      girl:{ cloth:'#E5B4C0', clothD:'#D494A6', hair:'#8B5A3C', hairD:'#74462E', skin:'#F6D9C4' }
    };
    const col = colors[gender] || colors.neutral;
    const x = this.playerX, gy = this.groundY - 44;
    const bob = Math.sin(this.runTime * 5.5) * 3;
    const y = gy + this.playerY + bob; /* playerY 为负=向上 */
    /* 腿（摆动） */
    const legA = Math.sin(this.runTime * 9) * 5;
    c.fillStyle = col.clothD;
    c.save(); c.translate(x, y);
    c.fillRect(-11, 8, 9, 15); 
    c.save(); c.translate(0, 8); c.rotate(legA*0.35); c.fillRect(-11, 0, 9, 12); c.restore();
    c.fillRect(2, 8, 9, 15);
    c.save(); c.translate(0, 8); c.rotate(-legA*0.35); c.fillRect(2, 0, 9, 12); c.restore();
    /* 身体 */
    c.fillStyle = col.cloth;
    this.roundRect(-16, -12, 32, 26, 10); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.25)';
    this.roundRect(-16, -12, 32, 9, 10); c.fill();
    /* 围巾/挂饰 */
    c.fillStyle = '#E9C46A';
    this.roundRect(-6, -6, 12, 5, 3); c.fill();
    /* 头 */
    c.fillStyle = col.skin;
    c.beginPath(); c.arc(0, -28, 16, 0, 6.28); c.fill();
    /* 头发 */
    c.fillStyle = col.hair;
    c.beginPath(); c.arc(0, -30, 16, Math.PI, 0); c.fill();
    if(gender === 'girl'){
      c.fillRect(-16, -30, 4, 16); c.fillRect(12, -30, 4, 16);
    }
    c.fillStyle = col.hairD;
    c.beginPath(); c.moveTo(-8, -34); c.quadraticCurveTo(0, -26, 8, -34); c.quadraticCurveTo(0, -40, -8, -34); c.fill();
    /* 眼睛 */
    c.fillStyle = '#37373F';
    c.beginPath(); c.arc(-6, -26, 2, 0, 6.28); c.fill();
    c.beginPath(); c.arc(6, -26, 2, 0, 6.28); c.fill();
    /* 腮红 */
    c.fillStyle = 'rgba(233,150,150,0.35)';
    c.beginPath(); c.arc(-11, -22, 3, 0, 6.28); c.fill();
    c.beginPath(); c.arc(11, -22, 3, 0, 6.28); c.fill();
    c.restore();
  },
  roundRect(x, y, w, h, r){
    const c = this.ctx;
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y, x+w, y+h, r); c.arcTo(x+w, y+h, x, y+h, r);
    c.arcTo(x, y+h, x, y, r); c.arcTo(x, y, x+w, y, r);
    c.closePath();
  },
  drawParticles(){
    const c = this.ctx;
    for(const p of this.parts){
      if(p.type === 'text'){
        c.globalAlpha = XGF.clamp(p.life*1.4, 0, 1);
        c.fillStyle = p.c;
        c.font = '800 20px "PingFang SC","Microsoft YaHei",sans-serif';
        c.textAlign = 'center';
        c.fillText(p.text, p.x, p.y - (0.9 - p.life) * 46);
        continue;
      }
      c.globalAlpha = XGF.clamp(p.life*2.2, 0, 1);
      c.fillStyle = p.c;
      c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.28); c.fill();
    }
    c.globalAlpha = 1;
  },

  /* 爸妈陪伴小人（点击爸妈球后出现，从身后追来陪跑一段） */
  drawCompanion(){
    if(!this.comp) return;
    const c = this.comp;
    const x = c.x, gy = this.groundY - 44;
    const bob = Math.sin(c.runT * 6) * 2.5;
    const y = gy + bob;
    const col = c.type === 'dad'
      ? { cloth:'#5B87AD', clothD:'#466E91', hair:'#2E2E38', hairD:'#22222A', skin:'#F6D9C4' }
      : { cloth:'#E5B4C0', clothD:'#D494A6', hair:'#8B5A3C', hairD:'#74462E', skin:'#F6D9C4' };
    const alpha = c.fade !== undefined ? Math.max(0, c.fade) : 1;
    const ctx = this.ctx;
    ctx.save();
    ctx.globalAlpha = alpha;
    const legA = Math.sin(c.runT * 11) * 6;
    ctx.fillStyle = col.clothD;
    ctx.translate(x, y);
    ctx.fillRect(-11, 8, 9, 15);
    ctx.save(); ctx.translate(0, 8); ctx.rotate(legA*0.4); ctx.fillRect(-11, 0, 9, 12); ctx.restore();
    ctx.fillRect(2, 8, 9, 15);
    ctx.save(); ctx.translate(0, 8); ctx.rotate(-legA*0.4); ctx.fillRect(2, 0, 9, 12); ctx.restore();
    ctx.fillStyle = col.cloth;
    this.roundRect(-16, -12, 32, 27, 10); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    this.roundRect(-16, -12, 32, 9, 10); ctx.fill();
    ctx.fillStyle = col.skin;
    ctx.beginPath(); ctx.arc(0, -29, 17, 0, 6.28); ctx.fill();
    ctx.fillStyle = col.hair;
    ctx.beginPath(); ctx.arc(0, -31, 17, Math.PI, 0); ctx.fill();
    if(c.type === 'mom'){ ctx.fillRect(-17, -31, 4, 17); ctx.fillRect(13, -31, 4, 17); }
    ctx.fillStyle = col.hairD;
    ctx.beginPath(); ctx.moveTo(-8, -35); ctx.quadraticCurveTo(0, -27, 8, -35); ctx.quadraticCurveTo(0, -41, -8, -35); ctx.fill();
    ctx.fillStyle = '#37373F';
    ctx.beginPath(); ctx.arc(-6, -27, 2, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -27, 2, 0, 6.28); ctx.fill();
    ctx.fillStyle = 'rgba(233,140,140,0.95)';
    ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('♥', 0, -44);
    ctx.restore();
  },

  /* 闪电特效（点击闪电球） */
  drawLightning(){
    if(this.lightningT <= 0) return;
    const c = this.ctx;
    const a = Math.min(1, this.lightningT / 0.8);
    const flash = a > 0.5 ? 0.42 : (Math.sin(this.lightningT * 42) > 0 ? 0.2 : 0);
    c.fillStyle = 'rgba(255,246,220,' + flash + ')';
    c.fillRect(0, 0, this.W, this.groundY);
    let x = this.playerX + XGF.rand(-30, 30), y = 26;
    c.lineWidth = 4; c.lineJoin = 'round'; c.lineCap = 'round';
    c.strokeStyle = 'rgba(255,238,180,' + (0.9*a) + ')';
    c.beginPath(); c.moveTo(x, y);
    while(y < this.groundY - 40){
      x += XGF.rand(-46, 46);
      y += XGF.rand(36, 70);
      c.lineTo(x, y);
    }
    c.stroke();
    c.lineWidth = 1.6;
    c.strokeStyle = 'rgba(255,255,255,' + (0.9*a) + ')';
    c.stroke();
  },

  /* 下雨特效（点击下雨球，短暂 3 秒） */
  drawRain(){
    if(this.rainT <= 0) return;
    const c = this.ctx;
    const n = Math.floor(this.W / 9);
    c.strokeStyle = 'rgba(178,204,235,0.5)';
    c.lineWidth = 1.4;
    c.beginPath();
    for(let i=0;i<n;i++){
      const sx = ((i * 97 + this.rainSeed * 7) % (this.W + 20)) - 10;
      const sy = ((i * 173 + performance.now() * 0.62) % (this.groundY + 40)) - 20;
      c.moveTo(sx, sy); c.lineTo(sx - 4, sy + 12);
    }
    c.stroke();
  },
  stop(){
    cancelAnimationFrame(this.raf);
    this.state = 'idle';
    XGF.audio.stopBGM();
    XGF.$('#pauseMask').classList.remove('show');
    XGF.$('#fadeWhite').classList.remove('on');
    XGF.$('#fxLayer').classList.remove('shade');
    XGF.$('#gameWrap').classList.remove('blur','shake');
    XGF.$('#bubble').innerHTML = '';
    if(this.blurTO) clearTimeout(this.blurTO);
    if(this.shakeTO) clearTimeout(this.shakeTO);
    if(this.shadeTO) clearTimeout(this.shadeTO);
  }
};

/* ---------------- [M12] game-ui 游戏界面 ---------------- */
XGF.game = {
  showHud(){
    const m = XGF.engine.meta;
    const idx = XGF.engine.levelIdx + 1;
    const nick = XGF.getConfig().profile.nickname || '宝贝';
    const suffix = idx === 6 ? '，最后一段啦，我们慢慢走' : '，慢慢来就好';
    XGF.$('#hudTitle').textContent = '第 ' + idx + ' 段 · ' + m.title + ' — ' + nick + suffix;
    const cfg = XGF.getConfig();
    XGF.$('#pSound').textContent = '音乐：' + (cfg.settings.sound === false ? '关' : '开');
  },
  bubble(){
    /* 35% 概率出现特殊功能球（闪电/雨/爸妈），其余为暖心文字球 */
    if(Math.random() < 0.35){
      const kinds = ['bolt','rain','dad','mom'];
      const kind = XGF.pick(kinds);
      const icon = { bolt:'⚡', rain:'🌧️', dad:'👨', mom:'👩' }[kind];
      const el = document.createElement('div');
      el.className = 'bubble-item bubble-special';
      el.textContent = icon;
      el.dataset.kind = kind;
      el.style.top = XGF.rand(14, 42) + '%';
      el.style.right = '-70px';
      el.addEventListener('click', () => {
        XGF.game.burst(el, () => XGF.engine.special(kind));
      });
      XGF.$('#bubble').appendChild(el);
      setTimeout(() => { if(el.parentNode) el.remove(); }, 9500);
      return;
    }
    /* 暖心文字球：从本关彩蛋池随机（家长配置平均分配，同关不重复） */
    const pool = (XGF.engine.eggPool && XGF.engine.eggPool.length)
      ? XGF.engine.eggPool : XGF.DEFAULT_EGGS;
    const el = document.createElement('div');
    el.className = 'bubble-item';
    el.textContent = XGF.pick(pool);
    el.style.top = XGF.rand(16, 52) + '%';
    el.style.right = '-40px';
    el.addEventListener('click', () => XGF.game.burst(el));
    XGF.$('#bubble').appendChild(el);
    setTimeout(() => { if(el.parentNode) el.remove(); }, 9500);
  },
  /* 点击气泡 → 破碎 + 加分 + 粒子（after 用于特殊球触发特效） */
  burst(el, after){
    if(el.dataset.burst) return;
    el.dataset.burst = '1';
    const r = el.getBoundingClientRect();
    XGF.audio.sfx('pop');
    XGF.engine.addScore(15, r.left + r.width/2, r.top + r.height/2);
    XGF.engine.burstParticles(r.left + r.width/2, r.top + r.height/2);
    el.classList.add('burst');
    setTimeout(() => {
      if(el.parentNode) el.remove();
      if(after) after();
    }, 260);
  },
  bind(){
    XGF.$('#btnPause').addEventListener('click', () => {
      XGF.audio.sfx('click');
      if(XGF.engine.state === 'run') XGF.engine.pause();
    });
    XGF.$('#pResume').addEventListener('click', () => { XGF.audio.sfx('click'); XGF.engine.resume(); });
    XGF.$('#pSound').addEventListener('click', () => { XGF.audio.toggle(); });
    XGF.$('#pQuit').addEventListener('click', () => {
      XGF.audio.sfx('click');
      XGF.engine.stop();
      XGF.select.render();
      XGF.router.show('select');
    });
    XGF.$('#btnQuit').addEventListener('click', () => {
      XGF.audio.sfx('click');
      if(XGF.engine.state === 'ready' || XGF.engine.state === 'run'){
        XGF.modal.confirm('要返回关卡选择吗？', '这段旅程随时可以再来，星光一直在等你。',
          [ { text:'继续前行', cls:'m-btn-ghost', fn:()=>{ if(XGF.engine.paused) XGF.engine.resume(); } },
            { text:'返回', cls:'m-btn-ok', fn:()=>{ XGF.engine.stop(); XGF.select.render(); XGF.router.show('select'); } } ]);
      }
    });
  },
  onClear(){
    /* 通关 → 记录进度 → 信封拆信 */
    const m = XGF.engine.meta;
    const prog = XGF.loadProgress();
    /* 解锁下一关（当前关保持解锁，终章无下一关） */
    const next = XGF.LEVEL_META[XGF.engine.levelIdx + 1];
    if(next && !prog.unlocked.includes(next.id)) prog.unlocked.push(next.id);
    const cfg = XGF.getConfig();
    /* 寄语推送：套用优先 → 未收藏 → 随机（已获取的不优先，除非无新寄语） */
    const msg = XGF.pickLevelMsg(m.id, prog.letters);
    const score = XGF.engine.score;
    const dup = prog.letters.find(l => l.levelId === m.id && l.message === msg);
    if(!dup){
      prog.letters.push({ levelId:m.id, title:m.title, message:msg,
        date: XGF.fmtDate(new Date()), icon:m.icon, score, loved:false });
    }
    /* 奖励信：仅终章（第 6 关）随机一封（孩子收藏馆已存在则不重复收藏）；
       前 5 关只送寄语，不发信 */
    const bonus = (m.id === 6) ? XGF.pickBonus(cfg, prog) : null;
    if(bonus){
      const dupB = prog.letters.find(l => l.levelId === 'bonus' && l.message === bonus.text);
      if(!dupB){
        prog.letters.push({ levelId:'bonus', title:bonus.title, message:bonus.text,
          date: XGF.fmtDate(new Date()), icon:'💌', score:0, loved:false });
      }
    }
    if(m.id === 6){
      prog.achievement = true;
      if(!prog.letters.find(l => l.levelId === 'ach')){
        prog.letters.push({ levelId:'ach', title:XGF.ACHIEVEMENT.title,
          message:XGF.ACHIEVEMENT.desc, date:XGF.fmtDate(new Date()), icon:XGF.ACHIEVEMENT.icon, ach:true, loved:false });
      }
      /* 新一轮旅程：重置关卡解锁（仅保留第 1 关），收藏馆与成就保留 */
      prog.rounds = (prog.rounds || 0) + 1;
      prog.unlocked = [1];
    }
    XGF.saveProgress(prog);
    XGF.engine.stop();
    XGF.message.render(m.id, score, msg, bonus);
  }
};

/* ---------------- 弹窗 & 提示 ---------------- */
XGF.modal = {
  el(){ return XGF.$('#modalBox'); },
  show(html, opts){
    const box = this.el();
    box.innerHTML = html;
    box.classList.toggle('lock', !!(opts && opts.lock));
    XGF.$('#modalMask').classList.add('show');
    if(opts && opts.onShow) opts.onShow(box);
    const close = XGF.$('.m-close');
    if(close) close.addEventListener('click', () => this.hide());
  },
  hide(){ XGF.$('#modalBox').classList.remove('lock'); XGF.$('#modalMask').classList.remove('show'); },
  confirm(title, body, actions){
    const acts = (actions || []).map(a =>
      `<button class="${a.cls||'m-btn-ok'}" data-i="${actions.indexOf(a)}">${a.text}</button>`).join('');
    this.show(`<div class="m-title">${title}</div><div class="m-body">${body}</div>
      <div class="m-actions">${acts}</div>`,
      { onShow(box){
        box.querySelectorAll('button[data-i]').forEach(b => {
          b.addEventListener('click', () => { XGF.modal.hide(); (actions[+b.dataset.i]||{}).fn && actions[+b.dataset.i].fn(); });
        });
      }});
  }
};
XGF.$('#modalMask').addEventListener('click', e => {
  if(e.target === XGF.$('#modalMask') && !XGF.$('#modalBox').classList.contains('lock')) XGF.modal.hide();
});

XGF.tips = {
  show(fromGame){
    XGF.modal.show(`<div class="m-title">☁️ 游玩温馨提示</div>
      <div class="m-body">建议游玩 <b>3–5 分钟</b><br>短暂放松后，继续前行就好。<br>
      <span style="color:var(--ink-soft);font-size:12.5px">没有输赢，没有排名，只有星光与陪伴</span></div>
      <div class="m-actions">
        <button class="m-btn-ok" id="tipsOk">${fromGame ? '好的，开始放松 ✦' : '我知道了'}</button>
      </div>`,
      { lock: !!fromGame,
        onShow(){
          XGF.$('#tipsOk').addEventListener('click', () => {
            XGF.modal.hide();
            if(fromGame){ XGF.audio.resume(); XGF.engine.run(); }
            else XGF.audio.sfx('click');
          });
        }});
  }
};

/* ---------------- [M13] message 寄语展示（前 5 关直展 / 终章拆信） ---------------- */
XGF.message = {
  render(levelId, score, msg, bonus){
    const m = XGF.LEVEL_META.find(l => l.id === levelId);
    const idx = XGF.LEVEL_META.findIndex(l => l.id === levelId) + 1;
    const cfg = XGF.getConfig();
    const nick = cfg.profile.nickname || '宝贝';
    const sign = cfg.signature || '爱你的爸爸妈妈';
    const isFinal = levelId === 6;
    const view = XGF.$('#view-message');
    const scoreHtml = `<div class="m-score">⭐ 本段收获 ${score || 0} 分</div>`;
    const bonusHtml = bonus
      ? `<div class="m-bonus" style="margin-top:16px;padding:12px 16px;border:1.5px dashed rgba(255,255,255,.45);border-radius:14px;background:rgba(255,255,255,.08);text-align:left;font-size:13.5px;line-height:1.9"><b style="color:#FFE9B8">💌 爸爸妈妈的来信 · ${bonus.title}</b><br>${bonus.text}</div>` : '';
    const bonusPaperHtml = bonus
      ? `<div class="p-bonus"><b>💌 爸爸妈妈的来信 · ${bonus.title}</b><br>${bonus.text}</div>` : '';
    const achHtml = isFinal ? `<div class="m-ach">🏆 ${XGF.ACHIEVEMENT.title}</div>` : '';
    const roundHtml = isFinal
      ? `<div class="p-round" style="margin-top:8px;font-size:12.5px;color:#A5714A;letter-spacing:1px;opacity:.85">🌱 第 ${XGF.loadProgress().rounds || 1} 轮星光旅程完成！关卡已重新点亮，和爸爸妈妈再走一遍吧</div>` : '';
    const actionsHtml = `
      <div class="msg-actions">
        <button class="msg-save" id="psSave">🖼️ 保存图片</button>
        ${isFinal
          ? `<button class="msg-home" id="psHome">🏠 返回首页</button>`
          : `<button class="msg-next" id="psNext">✦ 下一段旅程</button>
             <button class="msg-home" id="psHome">🏠 返回首页</button>`}
      </div>`;
    if(!isFinal){
      /* 前 5 关：直接展示寄语卡（不拆信） */
      view.innerHTML = `
        <div class="msg-card" style="animation:msgIn .8s ease both">
          <span class="m-star">✦</span>
          <div class="m-level">第 ${idx} 段旅程 · ${m.title}</div>
          <div class="m-title">${m.title}</div>
          <div class="m-nick">亲爱的${nick}：</div>
          <div class="m-text">${msg}</div>
          ${bonusHtml}
          ${scoreHtml}
          <div class="m-sign">— ${sign} · ${XGF.fmtDate(new Date()).slice(0,10)}</div>
        </div>
        ${actionsHtml}`;
      XGF.router.show('message');
      XGF.message.bindMsgActions(msg, nick, m.title, idx, isFinal, bonus, sign);
      return;
    }
    /* 终章：信封拆信动画 */
    view.innerHTML = `
      <div class="env-scene" id="envScene">
        <div class="env" id="envBox">
          <div class="env-back"></div>
          <div class="env-letter"><span style="color:#C9A87A;font-size:30px">✦</span></div>
          <div class="env-flap"></div>
          <div class="env-front"></div>
          <div class="env-seal">💖</div>
          <div class="env-to">给 ${nick}</div>
        </div>
        <div class="env-hint" id="envHint">轻轻点一下信封，拆开看看吧</div>
        <div class="paper-wrap">
          <div class="paper">
            <div class="p-star">✦</div>
            <div class="p-level">第 ${idx} 段旅程 · ${m.title}</div>
            <div class="p-title">终章 · 奔赴山海</div>
            <div class="p-nick">亲爱的${nick}：</div>
            <div class="p-text">${msg}</div>
            ${bonusPaperHtml}
            <div class="p-sign">— ${sign} · ${XGF.fmtDate(new Date()).slice(0,10)}</div>
            <div class="p-sep">✦ ✦ ✦</div>
            ${achHtml}
            ${roundHtml}
            <div class="p-score">⭐ 本段收获 ${score || 0} 分</div>
          </div>
          ${actionsHtml.replace('msg-actions', 'paper-actions')}
        </div>
      </div>`;
    XGF.router.show('message');
    /* 背景星 */
    const scene = view.querySelector('.env-scene');
    for(let i=0;i<34;i++){
      const s = document.createElement('i');
      s.className = 'bg-star';
      const sz = XGF.rand(2, 4);
      s.style.cssText = `left:${XGF.rand(0,100)}%;top:${XGF.rand(4,82)}%;width:${sz}px;height:${sz}px;animation-delay:${XGF.rand(0,3)}s`;
      scene.appendChild(s);
    }
    const envBox = XGF.$('#envBox');
    envBox.addEventListener('click', () => {
      if(envBox.classList.contains('open')) return;
      envBox.classList.add('open');
      XGF.audio.sfx('clear');
      setTimeout(() => {
        scene.classList.add('show-paper');
        XGF.message.bindMsgActions(msg, nick, m.title, idx, isFinal, bonus, sign);
      }, 1350);
    });
    setTimeout(() => { if(!envBox.classList.contains('open')) envBox.click(); }, 3200);
  },
  /* 统一绑定寄语页操作按钮 */
  bindMsgActions(msg, nick, title, idx, isFinal, bonus, sign){
    XGF.$('#psSave').addEventListener('click', () => {
      XGF.audio.sfx('click');
      XGF.message.capture(msg, nick, title, idx, isFinal, bonus, sign);
    });
    if(XGF.$('#psNext')) XGF.$('#psNext').addEventListener('click', () => {
      XGF.audio.sfx('click');
      const next = XGF.LEVEL_META[idx];
      XGF.engine.start(next.id);
    });
    if(XGF.$('#psHome')) XGF.$('#psHome').addEventListener('click', () => {
      XGF.audio.sfx('click');
      XGF.router.show('home');
    });
  },
  capture(msg, nick, title, idx, isFinal, bonus, sign){
    const w = 900, h = 1280;
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    /* 背景 */
    const g = c.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#2A3448'); g.addColorStop(0.5,'#3A3A5A'); g.addColorStop(1,'#5C4A5E');
    c.fillStyle = g; c.fillRect(0,0,w,h);
    /* 星光 */
    for(let i=0;i<70;i++){
      const x = (i*97.3)%w, y = (i*61.7)%(h*0.7);
      c.fillStyle = 'rgba(255,233,168,'+XGF.rand(0.2,0.7)+')';
      c.beginPath(); c.arc(x, y, XGF.rand(1,2.6), 0, 6.28); c.fill();
    }
    /* 卡片 */
    c.fillStyle = 'rgba(255,255,255,0.08)';
    c.beginPath(); this.rr(c, 70, 150, w-140, h-330, 40); c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.25)'; c.lineWidth = 2;
    c.beginPath(); this.rr(c, 70, 150, w-140, h-330, 40); c.stroke();
    /* 标题 */
    c.textAlign = 'center';
    c.fillStyle = '#FFE9B8';
    c.font = '700 46px "PingFang SC","Microsoft YaHei",sans-serif';
    c.fillText(isFinal ? '终章 · 奔赴山海' : title, w/2, 260);
    c.fillStyle = 'rgba(255,255,255,0.7)';
    c.font = '400 24px "PingFang SC","Microsoft YaHei",sans-serif';
    c.fillText('第 ' + idx + ' 段旅程 · 星光赴梦', w/2, 312);
    /* 昵称 */
    c.fillStyle = 'rgba(255,255,255,0.9)';
    c.font = '400 30px "PingFang SC","Microsoft YaHei",sans-serif';
    c.fillText('亲爱的' + nick + '：', w/2, 400);
    /* 寄语正文（左对齐逐行绘制，修复错位） */
    c.textAlign = 'left';
    c.font = '400 32px "PingFang SC","Microsoft YaHei",sans-serif';
    let ly = this.wrapText(c, msg, 130, 470, w-260, 60, 34);
    if(bonus){
      c.textAlign = 'center';
      c.font = '400 22px "PingFang SC","Microsoft YaHei",sans-serif';
      c.fillStyle = 'rgba(255,233,184,0.9)';
      c.fillText('— — — 爸爸妈妈的来信 · ' + bonus.title + ' — — —', w/2, ly + 20);
      c.textAlign = 'left';
      c.font = '400 24px "PingFang SC","Microsoft YaHei",sans-serif';
      ly = this.wrapText(c, bonus.text, 150, ly + 58, w-300, 42, 24);
      ly += 10;
    }
    /* 签名 */
    c.textAlign = 'center';
    c.fillStyle = 'rgba(255,255,255,0.65)';
    c.font = '400 26px "PingFang SC","Microsoft YaHei",sans-serif';
    c.fillText('— ' + sign + ' · ' + XGF.fmtDate(new Date()).slice(0,10), w/2, h-140);
    if(isFinal){
      c.fillStyle = '#FFE9A8';
      c.font = '700 28px "PingFang SC","Microsoft YaHei",sans-serif';
      c.fillText('🏆 不负时光，不负自己', w/2, h-90);
    }
    const url = cv.toDataURL('image/png');
    /* 预览浮层 */
    XGF.modal.show(`<div class="img-pop">
      <img src="${url}" alt="寄语卡片">
      <p>${/iPhone|iPad|Android/i.test(navigator.userAgent) ? '长按图片保存到相册' : '图片已生成，可右键另存'}</p>
      <button class="ip-close" id="imgClose">完成</button>
    </div>`,
    { onShow(){
      XGF.$('#imgClose').addEventListener('click', () => XGF.modal.hide());
      if(!/iPhone|iPad|Android/i.test(navigator.userAgent)){
        const a = document.createElement('a');
        a.href = url; a.download = '星光赴梦-寄语-' + title + '.png';
        document.body.appendChild(a); a.click(); a.remove();
        XGF.toast('图片已保存到下载目录');
      }
    }});
  },
  rr(c,x,y,w,h,r){ c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); },
  /* 返回写完后的 y 位置 */
  wrapText(c, text, x, y, maxW, lineH, size){
    const chars = Array.from(text);
    let line = '', ly = y;
    for(const ch of chars){
      if(c.measureText(line + ch).width > maxW && line){
        c.fillText(line, x, ly);
        line = ch; ly += lineH;
      } else line += ch;
    }
    if(line) c.fillText(line, x, ly);
    return ly + lineH;
  }
};

/* ---------------- [M14] letters 信件收藏馆（按关卡分组） ---------------- */
XGF.letters = {
  render(){
    const prog = XGF.loadProgress();
    const wrap = XGF.$('#lettersWrap');
    wrap.innerHTML = '';
    /* 分组：6 关各一组 + 最终分类（奖励信 & 成就） */
    const groups = [];
    XGF.LEVEL_META.forEach((lv, i) => {
      const items = prog.letters.filter(l => l.levelId === lv.id).slice().reverse();
      if(items.length) groups.push({ icon: lv.icon, title: '第' + (i+1) + '段 · ' + lv.title, items });
    });
    const finalItems = prog.letters.filter(l => l.levelId === 'ach' || l.levelId === 'bonus').slice().reverse();
    if(finalItems.length) groups.push({ icon: '🏆', title: '不负时光，不负自己', items: finalItems });
    if(!groups.length){
      wrap.innerHTML = `<div class="letters-empty">
        <div class="e-icon">🌙</div>
        <p>收藏馆还是空的</p>
        <p style="font-size:12.5px;margin-top:6px">去完成一段星光旅程，爸爸妈妈的寄语会在这里等你</p>
        <button class="btn-main" style="margin-top:22px;font-size:14px;padding:13px 34px" id="goPlay">✦ 去玩一关</button>
      </div>`;
      XGF.$('#goPlay').addEventListener('click', () => {
        XGF.audio.sfx('click'); XGF.select.render(); XGF.router.show('select');
      });
      return;
    }
    groups.forEach(g => {
      const gdiv = document.createElement('div');
      gdiv.className = 'letter-group';
      const head = document.createElement('div');
      head.className = 'lg-head';
      head.innerHTML = `<span class="lg-icon">${g.icon}</span>
        <span class="lg-title">${g.title}</span>
        <span class="lg-count">${g.items.length} 封</span>`;
      gdiv.appendChild(head);
      g.items.forEach(it => {
        /* 同关多封时标注序号（家长更新寄语后的新版本会继续收藏） */
        it._i = prog.letters.indexOf(it);
        const seq = prog.letters.filter(l => l.levelId === it.levelId && !['ach','bonus'].includes(String(l.levelId))).indexOf(it) + 1;
        const el = document.createElement('div');
        el.className = 'letter-item' + (it.ach ? ' ach' : '');
        el.innerHTML = `
          <div class="li-icon">${it.icon || '💌'}</div>
          <div class="li-body">
            <div class="li-top"><span class="li-title">${it.levelId === 'bonus' ? '💌 ' + it.title : it.title}${!it.ach && !['bonus'].includes(String(it.levelId)) && seq > 1 ? ' · 第' + seq + '封' : ''}</span><span class="li-date">${it.date}</span></div>
            <div class="li-text">${it.message}</div>
            ${typeof it.score === 'number' && it.score > 0 ? `<div class="li-score">⭐ ${it.score} 分</div>` : ''}
          </div>
          <div class="li-ops">
            <button class="li-love ${it.loved ? 'on' : ''}" data-love="${it._i}" title="收藏">${it.loved ? '❤️' : '🤍'}</button>
            <button class="li-del" data-del="${it._i}" title="删除">🗑️</button>
          </div>`;
        el.addEventListener('click', e => {
          if(e.target.closest('.li-ops')) return;
          XGF.audio.sfx('click');
          this.read(it);
        });
        el.querySelector('[data-love]').addEventListener('click', e => {
          e.stopPropagation();
          XGF.audio.sfx('pop');
          it.loved = !it.loved;
          XGF.saveProgress(prog);
          this.render();
        });
        el.querySelector('[data-del]').addEventListener('click', e => {
          e.stopPropagation();
          XGF.audio.sfx('click');
          XGF.modal.confirm('删除这封信？', '「' + it.title + '」删除后无法找回哦', [
            { text:'再想想', cls:'m-btn-ghost', fn:()=>{} },
            { text:'删除', cls:'m-btn-ok', fn:()=>{
              prog.letters = prog.letters.filter(l => l !== it);
              XGF.saveProgress(prog);
              XGF.toast('信件已删除');
              this.render();
            }}]);
        });
        gdiv.appendChild(el);
      });
      wrap.appendChild(gdiv);
    });
  },
  read(it){
    XGF.modal.show(`<div class="m-title">💌 ${it.title}</div>
      <div class="m-body" style="font-size:15.5px;line-height:2.1;text-align:left;padding:4px 8px">${it.message}</div>
      <div style="margin-top:10px;color:var(--ink-soft);font-size:12px">${it.date} · 星光赴梦</div>
      <div class="m-actions"><button class="m-btn-ok" id="readOk">收好啦</button></div>`,
      { onShow(){ XGF.$('#readOk').addEventListener('click', () => XGF.modal.hide()); }});
  },
  bind(){
    XGF.$('#backLettersHome').addEventListener('click', () => {
      XGF.audio.sfx('click'); XGF.router.show('home');
    });
  }
};

/* ---------------- 启动 ---------------- */
document.addEventListener('DOMContentLoaded', () => {
  XGF.theme.init();
  XGF.codePage.init();
  XGF.home.bind();
  XGF.select.bind();
  XGF.game.bind();
  XGF.letters.bind();
});
</script>
