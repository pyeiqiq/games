<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FBF8F3">
<title>星光赴梦 · 治愈跑酷</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
<style>
/* ============================================================
   星光赴梦 · 设计系统 tokens
   莫兰迪治愈色系：奶白 / 浅蓝 / 暖黄 / 淡紫
   ============================================================ */
:root{
  --bg:#FBF8F3; --bg2:#F2EDE4; --card:#FFFFFF; --card2:#FDFBF7;
  --ink:#4A4A52; --ink-soft:#8F8F99; --ink-strong:#37373F;
  --blue:#7FA8C9; --blue-deep:#5B87AD; --blue-soft:#EAF1F7;
  --yellow:#E9C46A; --yellow-deep:#C99A3F; --yellow-soft:#FBF3DC;
  --purple:#B8A7CE; --purple-deep:#9279B8; --purple-soft:#F1ECF7;
  --green:#8FB59A; --green-soft:#EAF3EC;
  --red:#C97B7B; --red-soft:#F9ECEC;
  --line:#E9E3D9;
  --shadow:0 4px 14px rgba(96,84,60,.07), 0 12px 40px rgba(96,84,60,.06);
  --shadow-lg:0 10px 30px rgba(96,84,60,.14);
  --radius:20px; --radius-lg:28px;
  --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",system-ui,-apple-system,sans-serif;
}
[data-theme="dark"]{
  --bg:#222A34; --bg2:#1C232C; --card:#2C3541; --card2:#313B48;
  --ink:#C6CDD7; --ink-soft:#8B95A3; --ink-strong:#EEF1F5;
  --blue:#8FB4D4; --blue-deep:#A9C8E0; --blue-soft:#2B3947;
  --yellow:#DDBB6F; --yellow-deep:#E6CC8F; --yellow-soft:#3A3322;
  --purple:#C6B5DC; --purple-deep:#D0C1E4; --purple-soft:#373040;
  --green:#A5C5AF; --green-soft:#2C3B32;
  --red:#D49A9A; --red-soft:#3E2D2D;
  --line:#3B4552;
  --shadow:0 4px 14px rgba(0,0,0,.25), 0 12px 40px rgba(0,0,0,.2);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font);background:var(--bg);color:var(--ink);
  overflow:hidden;line-height:1.7;font-size:15px;
  transition:background .5s,color .5s;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,textarea{font-family:inherit}

/* ============ 视图容器 ============ */
#app{position:fixed;inset:0}
.view{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.view.active{display:flex;animation:viewIn .5s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ============ 星星背景 ============ */
.sky{position:absolute;inset:0;overflow:hidden;pointer-events:none;
  background:linear-gradient(180deg,#E8EEF6 0%,#F3EEF7 55%,#FBF3DC 100%)}
[data-theme="dark"] .sky{background:linear-gradient(180deg,#1B2430 0%,#242B3A 60%,#2E2A35 100%)}
.sky .star{position:absolute;border-radius:50%;background:#FFF7DC;animation:twinkle var(--tw,3.2s) ease-in-out infinite alternate}
[data-theme="dark"] .sky .star{background:#FFE9A8}
@keyframes twinkle{from{opacity:.18;transform:scale(.75)}to{opacity:.95;transform:scale(1.15)}}

/* ============ 首页 ============ */
#view-home{align-items:center;justify-content:center;text-align:center}
.home-inner{position:relative;z-index:2;padding:0 28px;max-width:460px;width:100%}
.logo{font-size:46px;font-weight:800;letter-spacing:6px;color:var(--ink-strong);
  text-shadow:0 2px 24px rgba(201,154,63,.25)}
.logo .moon{display:inline-block;animation:moonFloat 4s ease-in-out infinite}
@keyframes moonFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.slogan{margin-top:12px;font-size:15px;color:var(--ink-soft);letter-spacing:3px}
.greet{margin-top:34px;font-size:20px;font-weight:600;color:var(--purple-deep)}
[data-theme="dark"] .greet{color:var(--purple)}
.home-btns{display:flex;flex-direction:column;gap:16px;margin-top:40px}
.btn-main{
  background:linear-gradient(135deg,#8FB4D4,#5B87AD);color:#fff;font-size:19px;font-weight:700;
  padding:17px 0;border-radius:99px;letter-spacing:3px;
  box-shadow:0 10px 26px rgba(91,135,173,.35);transition:.25s;
}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(91,135,173,.42)}
.btn-main:active{transform:scale(.97)}
.btn-sub{
  background:var(--card);color:var(--ink-strong);font-size:15px;font-weight:600;
  padding:14px 0;border-radius:99px;border:1px solid var(--line);
  box-shadow:var(--shadow);transition:.2s;
}
.btn-sub:hover{border-color:var(--purple);color:var(--purple-deep)}
.btn-sub:active{transform:scale(.97)}
.home-foot{display:flex;justify-content:center;gap:22px;margin-top:34px}
.btn-ghost{font-size:13px;color:var(--ink-soft);padding:8px 6px;border-radius:10px;transition:.2s}
.btn-ghost:hover{color:var(--blue-deep);background:var(--blue-soft)}

/* ============ 通用页面头 ============ */
.v-head{display:flex;align-items:center;gap:12px;padding:16px 20px 6px;flex:0 0 auto}
.v-head h2{font-size:20px;font-weight:800;color:var(--ink-strong)}
.v-head .head-name{margin-left:auto;font-size:13px;color:var(--purple-deep);background:var(--purple-soft);
  border-radius:99px;padding:4px 14px}
.back{font-size:14px;color:var(--ink-soft);padding:8px 12px;border-radius:12px;transition:.2s}
.back:hover{background:var(--bg2);color:var(--ink-strong)}

/* ============ 关卡选择 ============ */
#view-select{background:var(--bg)}
.level-grid{flex:1;overflow-y:auto;padding:18px 20px 30px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px;align-content:start}
.lv-card{
  position:relative;border-radius:var(--radius);padding:22px 16px 18px;text-align:center;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
  transition:.25s;overflow:hidden;cursor:pointer;
}
.lv-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.lv-card.locked{opacity:.55;cursor:not-allowed}
.lv-card.locked:hover{transform:none}
.lv-icon{font-size:40px;line-height:1;margin-bottom:10px;filter:drop-shadow(0 4px 8px rgba(201,154,63,.3))}
.lv-card.locked .lv-icon{filter:grayscale(1) opacity(.6)}
.lv-card .lv-no{font-size:11px;color:var(--ink-soft);letter-spacing:2px}
.lv-card .lv-name{font-size:15px;font-weight:700;color:var(--ink-strong);margin-top:3px}
.lv-card .lv-sub{font-size:11.5px;color:var(--ink-soft);margin-top:4px;line-height:1.5}
.lv-dot{position:absolute;top:12px;right:12px;font-size:13px}
.lv-dot.lit{color:var(--yellow-deep);animation:twinkle 2s infinite alternate}

/* ============ 游戏区 ============ */
#view-game{background:#232A36}
#gameWrap{position:absolute;inset:0}
#gameCanvas{width:100%;height:100%;display:block}
.hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;
  padding:14px 16px;gap:10px;pointer-events:none;z-index:5}
.hud .hud-btn{pointer-events:auto;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.16);
  color:#fff;font-size:15px;backdrop-filter:blur(6px);transition:.2s;display:flex;align-items:center;justify-content:center}
.hud .hud-btn:hover{background:rgba(255,255,255,.3)}
.hud-title{flex:1;text-align:center;color:#fff;font-size:14px;font-weight:600;letter-spacing:2px;
  text-shadow:0 2px 10px rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-score{pointer-events:none;color:#FFE9A8;font-size:15px;font-weight:800;letter-spacing:1px;
  text-shadow:0 2px 10px rgba(0,0,0,.4);min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.hud .hud-btn.sound-off{opacity:.55}
.pause-mask{position:absolute;inset:0;background:rgba(30,36,46,.55);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;z-index:20;flex-direction:column;gap:18px}
.pause-mask.show{display:flex;animation:viewIn .3s ease both}
.pause-mask .p-title{color:#fff;font-size:22px;font-weight:700;letter-spacing:6px;margin-bottom:6px}
.pause-mask .p-btn{min-width:220px;padding:14px 0;border-radius:99px;font-size:15px;font-weight:600;
  background:rgba(255,255,255,.14);color:#fff;letter-spacing:2px;transition:.2s}
.pause-mask .p-btn:hover{background:rgba(255,255,255,.28)}
.pause-mask .p-btn.primary{background:linear-gradient(135deg,#8FB4D4,#5B87AD);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.fx-layer{position:absolute;inset:0;pointer-events:none;z-index:6;background:transparent;transition:opacity .4s}
.fx-layer.shade{background:radial-gradient(ellipse at 50% 30%,rgba(20,24,36,0) 40%,rgba(20,24,36,.55) 100%)}
#gameWrap.blur{filter:blur(7px);transition:filter .12s}
#gameWrap.shake{animation:shakeAnim .3s ease}
@keyframes shakeAnim{0%,100%{transform:translate(0,0)}25%{transform:translate(-6px,2px)}50%{transform:translate(5px,-3px)}75%{transform:translate(-4px,-2px)}}
.fade-white{position:absolute;inset:0;background:#FFF6E3;opacity:0;pointer-events:none;z-index:15;transition:opacity 2.6s ease}
.fade-white.on{opacity:1}

/* 随机暖心气泡 */
#bubble{position:absolute;inset:0;pointer-events:none;z-index:7;overflow:hidden}
.bubble-item{position:absolute;font-size:15px;color:#fff;letter-spacing:1px;
  text-shadow:0 2px 12px rgba(0,0,0,.4);background:rgba(255,255,255,.16);
  padding:8px 18px;border-radius:99px;backdrop-filter:blur(4px);cursor:pointer;
  pointer-events:auto;transition:transform .15s;white-space:nowrap;
  animation:bubbleFloat 9s linear forwards}
.bubble-item:hover{transform:scale(1.06)}
.bubble-item.burst{animation:none;transform:scale(1.3);opacity:0;transition:.25s}
.bubble-special{width:56px;height:56px;padding:0;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:26px;
  background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.55);
  box-shadow:0 4px 18px rgba(0,0,0,.25), 0 0 0 6px rgba(255,255,255,.08);
  text-shadow:none;animation:bubbleFloat 9s linear forwards}
.bubble-special:hover{transform:scale(1.15)}
@keyframes bubbleFloat{from{transform:translateX(30px);opacity:0}
  8%{opacity:1}85%{opacity:1}to{transform:translateX(calc(-100vw - 120px));opacity:0}}

/* ============ 寄语页 ============ */
#view-message{align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(180deg,#2A3448 0%,#3A3A5A 55%,#5C4A5E 100%)}
.msg-card{
  position:relative;max-width:560px;width:100%;border-radius:var(--radius-lg);
  background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22);
  padding:40px 34px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);
  animation:msgIn 1s ease both;
}
@keyframes msgIn{from{opacity:0;transform:scale(.92) translateY(20px)}to{opacity:1;transform:none}}
.msg-card .m-star{font-size:34px;animation:twinkle 2.4s infinite alternate;display:inline-block}
.msg-card .m-level{color:rgba(255,255,255,.72);font-size:13px;letter-spacing:3px;margin-top:8px}
.msg-card .m-title{color:#FFE9B8;font-size:26px;font-weight:800;margin-top:6px;letter-spacing:2px}
.msg-card .m-nick{color:rgba(255,255,255,.85);font-size:14px;margin-top:16px}
.msg-card .m-text{color:#fff;font-size:17.5px;line-height:2.1;margin-top:12px;letter-spacing:1px;
  font-weight:400;text-align:justify}
.msg-card .m-sign{margin-top:22px;color:rgba(255,255,255,.6);font-size:13px}
.msg-card .m-score{display:inline-block;margin-top:18px;background:rgba(255,233,168,.16);
  color:#FFE9B8;font-size:14px;font-weight:700;border-radius:99px;padding:6px 22px;letter-spacing:2px;
  border:1px solid rgba(255,233,168,.3)}
.msg-card .m-ach{display:inline-block;margin-top:18px;background:linear-gradient(135deg,#E9C46A,#C99A3F);
  color:#4A3A12;font-size:13px;font-weight:700;border-radius:99px;padding:7px 20px;letter-spacing:2px;
  box-shadow:0 6px 18px rgba(201,154,63,.4)}
.msg-actions{display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.msg-actions button{padding:13px 26px;border-radius:99px;font-size:14px;font-weight:600;letter-spacing:2px;transition:.2s}
.msg-save{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3)}
.msg-save:hover{background:rgba(255,255,255,.3)}
.msg-next{background:linear-gradient(135deg,#E9C46A,#C99A3F);color:#4A3A12;box-shadow:0 8px 20px rgba(201,154,63,.35)}
.msg-next:hover{transform:translateY(-2px)}
.msg-home{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3)}
.msg-home:hover{background:rgba(255,255,255,.3)}

/* ============ 收藏馆 ============ */
#view-letters{background:var(--bg)}
.letters-wrap{flex:1;overflow-y:auto;padding:14px 20px 34px}
.letters-empty{text-align:center;padding:80px 20px;color:var(--ink-soft)}
.letters-empty .e-icon{font-size:52px;margin-bottom:14px}
.letter-item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow);cursor:pointer;transition:.2s;display:flex;gap:16px;align-items:flex-start}
.letter-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.letter-item .li-icon{font-size:34px;flex:0 0 auto;filter:drop-shadow(0 3px 6px rgba(201,154,63,.3))}
.letter-item .li-body{flex:1;min-width:0}
.letter-item .li-top{display:flex;align-items:baseline;gap:10px}
.letter-item .li-title{font-weight:700;color:var(--ink-strong);font-size:15px}
.letter-item .li-date{font-size:11.5px;color:var(--ink-soft)}
.letter-item .li-text{font-size:13px;color:var(--ink-soft);margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.letter-item .li-score{font-size:12px;color:var(--yellow-deep);font-weight:600;margin-top:5px}
.letter-item .li-ops{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;align-items:center}
.letter-item .li-love{font-size:19px;line-height:1;padding:4px;border-radius:50%;transition:.2s;filter:grayscale(.2)}
.letter-item .li-love:hover{transform:scale(1.25)}
.letter-item .li-love.on{filter:none;animation:lovePop .35s ease}
@keyframes lovePop{0%{transform:scale(.6)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.letter-item .li-del{font-size:15px;padding:4px;opacity:.5;transition:.2s}
.letter-item .li-del:hover{opacity:1;transform:scale(1.15)}
.letter-item.ach{background:linear-gradient(135deg,#FBF3DC,#F1ECF7)}
.letter-item.ach .li-title{color:#9A7228}
[data-theme="dark"] .letter-item.ach{background:linear-gradient(135deg,#3A3322,#373040)}

/* ============ 弹窗 ============ */
.modal-mask{position:fixed;inset:0;background:rgba(40,45,55,.45);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
.modal-mask.show{display:flex;animation:viewIn .3s ease both}
.modal{background:var(--card);border-radius:var(--radius-lg);max-width:440px;width:100%;
  padding:30px 28px;text-align:center;box-shadow:var(--shadow-lg);color:var(--ink)}
.modal .m-title{font-size:19px;font-weight:800;color:var(--ink-strong);margin-bottom:12px}
.modal .m-body{font-size:14.5px;color:var(--ink);line-height:1.9}
.modal .m-actions{display:flex;gap:12px;justify-content:center;margin-top:24px}
.modal .m-actions button{padding:12px 26px;border-radius:99px;font-size:14px;font-weight:600;transition:.2s}
.m-btn-ok{background:linear-gradient(135deg,#8FB4D4,#5B87AD);color:#fff;box-shadow:0 6px 16px rgba(91,135,173,.3)}
.m-btn-ok:hover{transform:translateY(-1px)}
.m-btn-ghost{background:var(--bg2);color:var(--ink-soft)}
.m-btn-ghost:hover{color:var(--ink-strong)}

/* ============ Toast ============ */
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(20px);
  background:rgba(50,55,66,.92);color:#fff;padding:11px 24px;border-radius:99px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.35s;z-index:80;letter-spacing:1px;max-width:86vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ 图片预览（截图保存） ============ */
.img-pop{background:var(--card);border-radius:var(--radius-lg);padding:20px;max-width:92vw;
  box-shadow:var(--shadow-lg);text-align:center;color:var(--ink)}
.img-pop img{max-width:100%;max-height:56vh;border-radius:14px;display:block;margin:0 auto}
.img-pop p{font-size:13px;color:var(--ink-soft);margin-top:12px}
.img-pop .ip-close{margin-top:14px;padding:10px 30px;border-radius:99px;background:var(--blue-deep);
  color:#fff;font-weight:600}

@media (max-width:560px){
  .logo{font-size:38px}
  .msg-card{padding:30px 22px}
  .msg-card .m-text{font-size:16px}
  .greet{font-size:18px}
}

/* ============ 游戏码启动页（云端模式） ============ */
#view-code{background:var(--bg);align-items:center;justify-content:center}
.code-box{position:relative;z-index:2;max-width:420px;width:100%;text-align:center;padding:0 26px}
.code-box .logo{font-size:40px}
.code-hint{margin-top:16px;color:var(--ink-soft);font-size:14px;line-height:1.9}
#codeInput{
  margin-top:26px;width:100%;text-align:center;font-size:34px;font-weight:800;letter-spacing:14px;
  padding:16px 10px;border-radius:18px;border:2px solid var(--purple);background:var(--card);
  color:var(--ink-strong);caret-color:var(--purple-deep);text-transform:uppercase;outline:none;
  box-shadow:var(--shadow);font-variant-numeric:tabular-nums;
}
#codeInput:focus{border-color:var(--purple-deep);box-shadow:0 0 0 4px var(--purple-soft)}
.code-box .btn-main{width:100%;margin-top:20px;font-size:17px}
.code-err{color:var(--red);font-size:13px;margin-top:12px;min-height:20px}
.code-box .btn-ghost{margin-top:18px;font-size:13px}
.code-box .cloud-tag{display:inline-block;margin-top:14px;font-size:11px;color:var(--ink-soft);
  background:var(--blue-soft);border-radius:99px;padding:3px 14px;letter-spacing:1px}

/* ============ 信封拆信动画（通关后） ============ */
.env-scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#2A3448 0%,#3A3A5A 55%,#5C4A5E 100%);overflow:hidden;z-index:2}
.env-scene .bg-star{position:absolute;border-radius:50%;background:#FFE9A8;animation:twinkle 3s infinite alternate}
.env{position:relative;width:340px;height:225px;cursor:pointer;perspective:900px;transform-style:preserve-3d}
.env-back{position:absolute;inset:0;background:#D9C4B0;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.env-front{position:absolute;left:0;right:0;bottom:0;height:118px;
  background:linear-gradient(180deg,#E5D2BE,#DCC7B1);border-radius:0 0 14px 14px;z-index:4}
.env-front::after{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:170px solid transparent;border-right:170px solid transparent;
  border-bottom:26px solid #DCC7B1;filter:drop-shadow(0 -1px 1px rgba(120,90,60,.15))}
.env-flap{position:absolute;top:0;left:0;right:0;height:112px;z-index:3;
  background:linear-gradient(180deg,#EBDAC6,#E0CCB6);border-radius:14px 14px 0 0;
  transform-origin:top;transform:rotateX(0);transition:transform .7s cubic-bezier(.6,.1,.3,1);
  clip-path:polygon(0 0,100% 0,50% 100%)}
.env.open .env-flap{transform:rotateX(180deg);z-index:1}
.env-letter{position:absolute;left:16px;right:16px;top:14px;bottom:14px;z-index:2;
  background:#FDF6E9;border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;
  transition:transform .9s cubic-bezier(.3,.7,.3,1) .25s}
.env.open .env-letter{transform:translateY(-132px) scale(1.55);z-index:6}
.env-seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;
  width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#E89A9A,#D16E6E);
  display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;
  box-shadow:0 4px 14px rgba(160,60,60,.45);transition:.4s}

/* ---------------- [M1] utils ---------------- */
const XGF = {};

/* ---------------- [M2] sha256 ---------------- */
XGF.sha256 = (function(){
  function rotR(n,x){return (x>>>n)|(x<<(32-n))}
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,

    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const H0=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  function strToBytes(s){
    const out=[];for(let i=0;i<s.length;i++){let c=s.codePointAt(i);
      if(c>0xffff){out.push(0xf0|(c>>18),0x80|((c>>12)&63),0x80|((c>>6)&63),0x80|(c&63));i++}

      else if(c>0x7f){out.push(0xc0|(c>>6),0x80|(c&63))}
      else out.push(c)}
    return out;
  }
  return function sha256(str){
    const bytes=strToBytes(str), len=bytes.length, bitLen=len*8;
    const ml=((bitLen/0x20000000)|0)>>>0, mr=(bitLen>>>0);
    const msg=new Uint8Array(((len+9+63)>>6)<<6);
    msg.set(bytes);msg[len]=0x80;
    const dv=new DataView(msg.buffer);
    dv.setUint32(msg.length-8,ml);dv.setUint32(msg.length-4,mr);
    const h=H0.slice(), w=new Uint32Array(64);
    for(let i=0;i<msg.length;i+=64){
      for(let t=0;t<16;t++)w[t]=dv.getUint32(i+t*4);
      for(let t=16;t<64;t++){
        const s0=rotR(7,w[t-15])^rotR(18,w[t-15])^(w[t-15]>>>3);
        const s1=rotR(17,w[t-2])^rotR(19,w[t-2])^(w[t-2]>>>10);
        w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0;
      }
      let a=h[0],b=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
      for(let t=0;t<64;t++){
        const S1=rotR(6,e)^rotR(11,e)^rotR(25,e);
        const ch=(e&f)^(~e&g);
        const t1=(hh+S1+ch+K[t]+w[t])>>>0;
        const S0=rotR(2,a)^rotR(13,a)^rotR(22,a);
        const maj=(a&b)^(a&c)^(b&c);
        const t2=(S0+maj)>>>0;
        hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
      }
      h[0]=(h[0]+a)>>>0;h[1]=(h[1]+b)>>>0;h[2]=(h[2]+c)>>>0;h[3]=(h[3]+d)>>>0;
      h[4]=(h[4]+e)>>>0;h[5]=(h[5]+f)>>>0;h[6]=(h[6]+g)>>>0;h[7]=(h[7]+hh)>>>0;
    }
    let out='';
    for(let i=0;i<8;i++)out += h[i].toString(16).padStart(8,'0');
    return out;
  };
})();
XGF.hashPassword = async function(pwd, salt){
  const s = salt + '::' + pwd;
  try{
    if(window.crypto && crypto.subtle){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  return XGF.sha256(s);
};
XGF.genSalt = () => {
  let s=''; const c='abcdefghijklmnopqrstuvwxyz0123456789';
  for(let i=0;i<16;i++) s += c[Math.floor(Math.random()*c.length)];
  return s;
};

/* ---- 配置（config v2：落款 / 自定义寄语 / 奖励信 / 关卡套用） ---- */
XGF.defaultConfig = function(){
  return {
    version: 2,
    profile: { nickname:'宝贝', gender:'neutral', welcome: XGF.DEFAULT_WELCOME },
    signature: '爱你的爸爸妈妈',
    levels: XGF.DEFAULT_LEVELS.map(l => ({ id:l.id, title:l.title, message:l.message, custom_ids: [] })),
    custom_messages: [],
    bonus_letters: [],
    eggs: XGF.DEFAULT_EGGS.slice(),
    settings: { sound:true, darkMode:'auto' },
    security: { hash:'', salt:'' }
  };
};
XGF.migrateConfig = function(c){
  if(!c || typeof c !== 'object') return XGF.defaultConfig();
  if(!Array.isArray(c.levels) || !c.levels.length) c.levels = XGF.defaultConfig().levels;
  c.levels.forEach(l => { if(!Array.isArray(l.custom_ids)) l.custom_ids = []; });
  if(!Array.isArray(c.custom_messages)) c.custom_messages = [];
  if(!Array.isArray(c.bonus_letters)) c.bonus_letters = [];
  if(!c.profile) c.profile = { nickname:'宝贝', gender:'neutral', welcome: XGF.DEFAULT_WELCOME };
  if(!c.signature) c.signature = '爱你的爸爸妈妈';
  if(!Array.isArray(c.eggs) || !c.eggs.length) c.eggs = XGF.DEFAULT_EGGS.slice();
  /* 旧 8 条默认彩蛋 → 自动升级为 18 条（家长自定义过的不动） */
  if(c.eggs.length === XGF.LEGACY_DEFAULT_EGGS.length &&
     c.eggs.every(e => XGF.LEGACY_DEFAULT_EGGS.includes(e)) &&
     XGF.LEGACY_DEFAULT_EGGS.every(e => c.eggs.includes(e))){
    c.eggs = XGF.DEFAULT_EGGS.slice();
  }
  if(!c.settings) c.settings = { sound:true, darkMode:'auto' };
  if(!c.security) c.security = { hash:'', salt:'' };
  c.version = 2;
  return c;
};

XGF._cfgCache = null;
XGF._progCache = null;
/* 云端模式：配置/进度只存云端（localStorage 仅存游戏码）；游客模式：独立 GUEST key */
XGF.loadConfig = function(){
  if(XGF._cfgCache) return XGF._cfgCache;
  if(XGF.CLOUD.enabled) return null;
  try{
    const raw = localStorage.getItem(GUEST_CFG_KEY);
    if(raw) return XGF.migrateConfig(JSON.parse(raw));
  }catch(e){}
  return null;
};
XGF.getConfig = function(){
  if(XGF._cfgCache) return XGF._cfgCache;
  let c = XGF.loadConfig();
  if(!c){ c = XGF.defaultConfig(); XGF.saveConfig(c); }
  else XGF._cfgCache = c;
  return c;
};
XGF.saveConfig = function(cfg){
  XGF._cfgCache = XGF.migrateConfig(cfg);
  if(XGF.CLOUD.enabled && XGF.CLOUD.code){
    XGF.CLOUD.saveGameConfig(XGF._cfgCache).catch(() => XGF.toast('云端保存失败，请检查网络'));
    return true;
  }
  try{ localStorage.setItem(GUEST_CFG_KEY, JSON.stringify(XGF._cfgCache)); }catch(e){}
  return true;
};
XGF.loadProgress = function(){
  if(XGF._progCache) return XGF._progCache;
  if(XGF.CLOUD.enabled) return null;
  try{
    const raw = localStorage.getItem(GUEST_PROG_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { unlocked:[1], letters:[], achievement:false };
};
XGF.saveProgress = function(p){
  XGF._progCache = p;
  if(XGF.CLOUD.enabled && XGF.CLOUD.code){
    XGF.CLOUD.saveProgress(p).catch(() => {});
    return true;
  }
  try{ localStorage.setItem(GUEST_PROG_KEY, JSON.stringify(p)); }catch(e){}
  return true;
};

/* ---- 寄语候选池（套用优先 → 未收藏 → 随机） ---- */
XGF.getLevelCandidates = function(id){
  const cfg = XGF.getConfig();
  const lv = cfg.levels.find(l => l.id === id);
  const list = [];
  if(lv && lv.message && lv.message.trim()) list.push(lv.message);
  ((lv && lv.custom_ids) || []).forEach(cid => {
    const cm = cfg.custom_messages.find(m => m.id === cid);
    if(cm && cm.text && cm.text.trim() && !list.includes(cm.text)) list.push(cm.text);
  });
  if(!list.length){
    const d = XGF.DEFAULT_LEVELS.find(l => l.id === id);
    if(d && d.message) list.push(d.message);
  }
  return list;
};
XGF.pickLevelMsg = function(id, letters){
  /* 推送规则：
     有套用 → 只用套用寄语（未获取优先）；自定义全部被获取 → 补充系统模板中未获取的；全用完 → 任意。
     无套用 → 从「内置寄语 + 系统模板」池随机（未获取优先），保证重复游玩不单调。 */
  let cfg = XGF._cfgCache;
  if(!XGF.CLOUD.enabled){
    try{ const raw = localStorage.getItem(GUEST_CFG_KEY); if(raw) cfg = XGF.migrateConfig(JSON.parse(raw)); }catch(e){}
  }
  if(!cfg) cfg = XGF.getConfig();
  const lv = cfg.levels.find(l => l.id === id);
  const customTexts = ((lv && lv.custom_ids) || []).map(cid => cfg.custom_messages.find(m => m.id === cid))
    .filter(m => m && m.text && m.text.trim()).map(m => m.text);
  let base = (lv && lv.message && lv.message.trim()) ? lv.message : '';
  if(!base){ const d = XGF.DEFAULT_LEVELS.find(l => l.id === id); if(d) base = d.message; }
  const collected = m => (letters || []).some(l => l.levelId === id && l.message === m);
  const tpl = Object.values(XGF.TEMPLATES).flat();
  let pool;
  if(customTexts.length){
    /* 有套用：只用套用的；全部被获取则补充系统模板 */
    pool = customTexts.slice();
    if(pool.every(collected)){
      tpl.forEach(t => { if(!pool.includes(t)) pool.push(t); });
    }
  } else {
    /* 无套用：内置 + 系统模板（去重） */
    pool = [base];
    tpl.forEach(t => { if(!pool.includes(t)) pool.push(t); });
  }
  const uncollected = pool.filter(m => !collected(m));
  return XGF.pick(uncollected.length ? uncollected : pool);
};
XGF.pickBonus = function(cfg, prog){
  const list = cfg.bonus_letters || [];
  if(!list.length) return null;
  const collected = new Set((prog.letters || []).filter(l => l.levelId === 'bonus').map(l => l.message));
  const uncollected = list.filter(b => !collected.has(b.text));
  return XGF.pick(uncollected.length ? uncollected : list);
};

/* ---- 云端会话 ---- */
XGF.cloud = {
  async init(code){
    try{
      const cfg = await XGF.CLOUD.loadGame(code);
      if(!cfg) return 'notfound';
      /* 切换/进入游戏码：完全重置缓存，杜绝上一个游戏码的数据残留 */
      const migrated = XGF.migrateConfig(cfg);
      /* 迁移升级（如旧 8 条彩蛋 → 18 条）：静默写回云端持久化 */
      if(JSON.stringify(migrated) !== JSON.stringify(cfg)){
        XGF.CLOUD.saveGameConfig(migrated).catch(() => {});
      }
      XGF._cfgCache = migrated;
      XGF._progCache = null;
      XGF.CLOUD.enabled = true;
      XGF.CLOUD.code = code;
      try{ localStorage.setItem(CODE_KEY, code); }catch(e){}
      /* 云端进度：有则加载，无则全新默认（绝不复用本地残留） */
      try{
        const p = await XGF.CLOUD.loadProgress();
        XGF._progCache = p || { unlocked:[1], letters:[], achievement:false };
      }catch(e){
        XGF._progCache = { unlocked:[1], letters:[], achievement:false };
      }
      return 'ok';
    }catch(e){ return 'network'; }
  },
  reset(){
    XGF.CLOUD.enabled = false;
    XGF.CLOUD.code = null;
    XGF._cfgCache = null;
    XGF._progCache = null;
    try{ localStorage.removeItem(CODE_KEY); }catch(e){}
  }
};

/* ---------------- [M5] theme 主题 ---------------- */
XGF.theme = {
  apply(){
    const m = XGF.getConfig().settings.darkMode || 'auto';
    const dark = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.body.dataset.theme = dark ? 'dark' : 'light';
    const btn = XGF.$('#btnTheme');
    if(btn) btn.textContent = dark ? '☀️ 日间模式' : '🌙 夜间模式';
  },
  cycle(){
    const cfg = XGF.getConfig();
    const cur = cfg.settings.darkMode || 'auto';
    const order = ['auto','light','dark'];
    cfg.settings.darkMode = order[(order.indexOf(cur)+1) % order.length];
    XGF.saveConfig(cfg);
    XGF.theme.apply();
    const names = { auto:'跟随系统', light:'日间', dark:'夜间' };
    XGF.toast('已切换为' + names[cfg.settings.darkMode] + '模式');
  },
  init(){
    XGF.theme.apply();
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => XGF.theme.apply());
  }
};

/* ---------------- [M6] audio 轻柔钢琴 ---------------- */
XGF.audio = {
  ctx:null, master:null, bgmGain:null, timer:null, step:0, muted:false,
  init(){
    if(this.ctx) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.6;
      this.master.connect(this.ctx.destination);
      this.bgmGain = this.ctx.createGain();
      this.bgmGain.gain.value = 0.22;
      this.bgmGain.connect(this.master);
      const cfg = XGF.getConfig();
      this.muted = !(cfg.settings && cfg.settings.sound !== false);
    }catch(e){ console.warn('audio init fail', e); }
  },
  resume(){ if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setMuted(m){
    this.muted = m;
    const cfg = XGF.getConfig();
    cfg.settings.sound = !m;
    XGF.saveConfig(cfg);
    if(this.master && this.ctx) this.master.gain.linearRampToValueAtTime(m ? 0 : 0.6, this.ctx.currentTime + 0.3);
    XGF.$('#pSound').textContent = '音乐：' + (m ? '关' : '开');
  },
  toggle(){ this.init(); this.setMuted(!this.muted); },
  /* 轻柔钢琴：C 大调和弦琶音循环（C - Am - F - G） */
  startBGM(){
    this.init();
    if(!this.ctx || this.bgmTimer) return;
    const chords = [
      [261.63, 329.63, 392.00, 523.25],  // C
      [220.00, 261.63, 329.63, 440.00],  // Am
      [174.61, 220.00, 261.63, 349.23],  // F
      [196.00, 246.94, 293.66, 392.00]   // G
    ];
    const bass = [130.81, 110.00, 87.31, 98.00];
    let chordIdx = 0, noteIdx = 0;
    const playNote = (freq, t, vol) => {
      const osc = this.ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const osc2 = this.ctx.createOscillator();
      osc2.type = 'sine';
      osc2.frequency.value = freq * 2;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
      osc.connect(g); osc2.connect(g);
      const g2 = this.ctx.createGain(); g2.gain.value = 0.25; osc2.connect(g2); g2.connect(g);
      g.connect(this.bgmGain);
      osc.start(t); osc2.start(t);
      osc.stop(t + 1.7); osc2.stop(t + 1.7);
    };
    const tick = () => {
      if(this.muted) return;
      const t = this.ctx.currentTime + 0.05;
      const ch = chords[chordIdx];
      playNote(bass[chordIdx], t, 0.5);
      playNote(ch[noteIdx], t + 0.05, 0.42);
      playNote(ch[(noteIdx+1) % 4], t + 0.35, 0.35);
      noteIdx = (noteIdx + 1) % 4;
      if(noteIdx === 0) chordIdx = (chordIdx + 1) % 4;
    };
    tick();
    this.bgmTimer = setInterval(tick, 1500);
  },
  stopBGM(){ if(this.bgmTimer){ clearInterval(this.bgmTimer); this.bgmTimer = null; } },
  sfx(kind){
    this.init();
    if(!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const tone = (f, d, type='sine', vol=0.5, when=0, glideTo=null) => {
      const o = this.ctx.createOscillator();
      o.type = type; o.frequency.value = f;
      if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + when + d);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t + when);
      g.gain.linearRampToValueAtTime(vol, t + when + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + when + d);
      o.connect(g); g.connect(this.master);
      o.start(t + when); o.stop(t + when + d + 0.05);
    };
    if(kind === 'collect'){ tone(880, 0.18, 'sine', 0.35, 0, 1568); }
    else if(kind === 'clear'){ tone(523, 0.3, 'sine', 0.4); tone(659, 0.3, 'sine', 0.4, 0.14); tone(784, 0.5, 'sine', 0.45, 0.28); }
    else if(kind === 'click'){ tone(420, 0.07, 'sine', 0.2); }
    else if(kind === 'start'){ tone(392, 0.25, 'sine', 0.3); tone(523, 0.35, 'sine', 0.3, 0.12); }
    else if(kind === 'jump'){ tone(280, 0.16, 'sine', 0.2, 0, 620); }
    else if(kind === 'hit'){ tone(170, 0.13, 'triangle', 0.2, 0, 108); }
    else if(kind === 'pop'){ tone(520, 0.12, 'sine', 0.28, 0, 950); }
    else if(kind === 'thunder'){ this.noise(0.5, 0.26, 240); }
    else if(kind === 'rain'){ this.noise(1.1, 0.07, 1500); }
    else if(kind === 'companion'){ tone(523, 0.22, 'sine', 0.3); tone(659, 0.3, 'sine', 0.3, 0.12); tone(784, 0.4, 'sine', 0.3, 0.24); }
  },
  /* 合成噪声（雷声 / 雨声） */
  noise(dur, vol, freq){
    const ctx = this.ctx;
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<len;i++) data[i] = (Math.random()*2-1) * (1 - i/len);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    src.connect(filt); filt.connect(g); g.connect(this.master);
    src.start();
  }
};

/* ---------------- [M7.5] codePage 游戏码启动页 ---------------- */
XGF.codePage = {
  init(){
    XGF.home.makeStars(XGF.$('#codeSky'));
    /* 事件绑定必须始终执行（即使有已存码，失效后也需能手动输入新码） */
    const input = XGF.$('#codeInput');
    input.addEventListener('input', () => {
      input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
      XGF.$('#codeErr').textContent = '';
    });
    input.addEventListener('keydown', e => { if(e.key === 'Enter') XGF.$('#btnCodeEnter').click(); });
    XGF.$('#btnCodeEnter').addEventListener('click', async () => {
      const code = input.value.trim();
      if(code.length < 6){ XGF.$('#codeErr').textContent = '请输入 6 位游戏码哦'; return; }
      XGF.$('#codeErr').textContent = '正在进入星光…';
      const r = await XGF.cloud.init(code);
      if(r === 'ok'){
        XGF.home.render();
        XGF.router.show('home');
        XGF.toast('欢迎回来，专属旅程已加载 ✦');
      } else if(r === 'notfound'){
        XGF.$('#codeErr').textContent = '没找到这个游戏码，跟爸爸妈妈确认一下哦';
      } else {
        XGF.$('#codeErr').textContent = '网络开小差了，再试一次';
      }
    });
    XGF.$('#btnGuest').addEventListener('click', () => {
      XGF.cloud.reset();
      /* 游客：全新默认模板 + 独立游客进度（看不到任何家长内容） */
      XGF._cfgCache = XGF.defaultConfig();
      XGF._progCache = { unlocked:[1], letters:[], achievement:false };
      XGF.saveConfig(XGF._cfgCache);
      XGF.saveProgress(XGF._progCache);
      XGF.home.render();
      XGF.router.show('home');
      XGF.toast('游客模式：使用默认模板，只看到自己的内容');
    });
    /* 自动登录（已存码） */
    let saved = null;
    try{ saved = localStorage.getItem(CODE_KEY); }catch(e){}
    if(saved){
      XGF.cloud.init(saved).then(r => {
        if(r === 'ok'){ XGF.home.render(); XGF.theme.apply(); XGF.router.show('home'); }
        else {
          XGF.cloud.reset();
          XGF.$('#codeErr').textContent = r === 'network' ? '网络开小差了，再试一次' : '这个游戏码已失效，请重新输入';
        }
      });
    }
  }
};

  makeStars(skyEl){
    const sky = skyEl || XGF.$('#homeSky');

  bind(){

      XGF.audio.init(); XGF.audio.resume();

    XGF.$('#btnLetters').addEventListener('click', () => { XGF.letters.render(); XGF.router.show('letters'); });
    XGF.$('#btnTips').addEventListener('click', () => XGF.tips.show());
    XGF.$('#btnTheme').addEventListener('click', () => { XGF.audio.sfx('click'); XGF.theme.cycle(); });
    XGF.$('#btnSwitch').addEventListener('click', () => {

};

/* 天空渐变（浅色/深色主题两套） */
XGF.SKIES = {
  dawn:   { light:['#8FA8C8','#C9AFC4','#F3D9B0'], dark:['#232F44','#3D3552','#5A4A52'] },
  morning:{ light:['#A9C7DC','#D8E3E8','#F6EDDC'], dark:['#263244','#3A4456','#4A4656'] },
  night:  { light:['#5B7CA3','#7C6FA0','#A08AA8'], dark:['#151E30','#2A2740','#3E3652'] },
  bright: { light:['#7CA6C8','#B0BFD8','#EFE0C0'], dark:['#1E2A3C','#33405A','#4E4660'] },
  galaxy: { light:['#4E6E96','#6B5F97','#8E7AA6'], dark:['#101828','#24213C','#3A3050'] },

  dawn:   '#A9B7C9', morning:'#C4CDD2', night:'#6E7891', bright:'#AEBBC8', galaxy:'#565A78', final:'#3E4466'
};
XGF.STAR_DENSITY = {
  sparse: 26, soft: 34, few: 14, dense: 60, medium: 44, sea: 80
